# "Tuned" Redis 7.4 profile (spec §13.6): maxmemory kept under bench-redis's own container memory
# limit (benchmark/docker-compose.yml `mem_limit: 4g`, mirrored in
# benchmark/agrobench/config.py:RESOURCE_LIMITS — keep the three in sync), larger listpack
# thresholds for compact hash encoding, lazy-free reclamation, more I/O threads, and RDB
# snapshots disabled (durability here comes from AOF only, controlled separately by
# benchmark/bench.sh's durability flag — see spec §13.6).
protected-mode no

maxmemory 3072mb
maxmemory-policy noeviction

hash-max-listpack-entries 512
hash-max-listpack-value 128

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes

io-threads 2

save ""

# Diagnostics, identical in both profiles (not a tuning knob): DEBUG DIGEST lets the measurement
# harness (agrobench.workload) prove the dataset is byte-for-byte restored after every write/delete
# series; the latency monitor feeds the LATENCY snapshots in results/redis/ (spec §13.6). SLOWLOG
# keeps its stock threshold (10 ms).
enable-debug-command yes
latency-monitor-threshold 1
