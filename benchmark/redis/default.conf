# "Default" Redis 7.4 profile (spec §13.6): values close to the compiled-in defaults, used as the
# baseline against redis/tuned.conf. protected-mode is off only because bench-redis publishes no
# host port and is reachable solely from the agrotrace-bench compose network.
protected-mode no

maxmemory 0
maxmemory-policy noeviction

hash-max-listpack-entries 128
hash-max-listpack-value 64

lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
lazyfree-lazy-user-del no
lazyfree-lazy-user-flush no

io-threads 1

# Stock RDB snapshot schedule (compiled default). appendonly/appendfsync are always passed on the
# command line by benchmark/bench.sh, per the requested durability mode (spec §13.6).
save 3600 1
save 300 100
save 60 10000

# Diagnostics, identical in both profiles (not a tuning knob): DEBUG DIGEST lets the measurement
# harness (agrobench.workload) prove the dataset is byte-for-byte restored after every write/delete
# series; the latency monitor feeds the LATENCY snapshots in results/redis/ (spec §13.6). SLOWLOG
# keeps its stock threshold (10 ms).
enable-debug-command yes
latency-monitor-threshold 1
