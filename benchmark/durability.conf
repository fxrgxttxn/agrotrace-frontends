# Single source of truth for durability (strict|relaxed) -> concrete DBMS settings (spec §13.6).
# Parsed independently by benchmark/bench.sh (pure grep/cut — the host has no Python, only Docker
# + Git) and by agrobench.config (Python, used by agrobench.load_redis to restore the right
# appendfsync after the bulk pipeline load, and by tests/test_env.py's expected-settings checks).
# Format: "<durability>.<key>=<value>", one per line.
strict.pg_synchronous_commit=on
strict.redis_appendfsync=always
relaxed.pg_synchronous_commit=off
relaxed.redis_appendfsync=everysec
