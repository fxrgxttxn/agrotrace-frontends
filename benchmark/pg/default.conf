# "Default" PostgreSQL 16 profile (spec §13.6): values close to the compiled-in defaults, used
# as the baseline against pg/tuned.conf. This file fully replaces postgresql.conf (bench-postgres
# is started with `-c config_file=...`, see benchmark/docker-compose.yml), so listen_addresses
# must be set explicitly — the compiled default (`localhost`) would refuse bench-runner's
# cross-container connections.
listen_addresses = '*'
max_connections = 100

shared_buffers = 128MB
effective_cache_size = 4GB
work_mem = 4MB
maintenance_work_mem = 64MB
random_page_cost = 4.0
effective_io_concurrency = 1
max_wal_size = 1GB

# Overridden on the command line by benchmark/bench.sh to match the requested durability mode
# (strict -> on, relaxed -> off); the value here is only the fallback if that override is absent.
synchronous_commit = on

logging_collector = off
