# "Tuned" PostgreSQL 16 profile (spec §13.6). Sized to bench-postgres's own container memory
# limit (benchmark/docker-compose.yml `mem_limit: 4g`, mirrored in
# benchmark/agrobench/config.py:RESOURCE_LIMITS — keep the three in sync): shared_buffers 25% of
# 4096 MB, effective_cache_size 70% of 4096 MB, per spec §13.6. This file fully replaces
# postgresql.conf (`-c config_file=...`), so listen_addresses/max_connections are repeated from
# pg/default.conf.
listen_addresses = '*'
max_connections = 100

shared_buffers = 1024MB
effective_cache_size = 2867MB
work_mem = 32MB
maintenance_work_mem = 512MB
random_page_cost = 1.1
effective_io_concurrency = 200
max_wal_size = 4GB

# Overridden on the command line by benchmark/bench.sh to match the requested durability mode
# (strict -> on, relaxed -> off); the value here is only the fallback if that override is absent.
synchronous_commit = on

logging_collector = off
