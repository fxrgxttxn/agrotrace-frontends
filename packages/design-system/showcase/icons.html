<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Графика — «Поле»</title>
    <link rel="stylesheet" href="../index.css" />
    <link rel="stylesheet" href="showcase.css" />
    <script src="showcase.js" defer></script>
  </head>
  <body data-ds-split>
    <header class="ds-header">
      <a class="ds-brand" href="index.html" data-ds-keep-theme>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M4 20 9 4M10 20l5-16M16 20l4-13" />
        </svg>
        Поле
      </a>
      <nav aria-label="Разделы витрины">
        <ul class="ds-nav">
          <li><a href="index.html" data-ds-keep-theme>Основа</a></li>
          <li><a href="forms.html" data-ds-keep-theme>Формы</a></li>
          <li><a href="data.html" data-ds-keep-theme>Данные</a></li>
          <li><a href="shell.html" data-ds-keep-theme>Каркас</a></li>
          <li><a href="icons.html" aria-current="page" data-ds-keep-theme>Графика</a></li>
        </ul>
      </nav>
    </header>

    <main class="ds-cols">
      <div class="ds-col">
        <h1>Графика</h1>

        <section class="ds-section" aria-labelledby="s-icons">
          <h2 id="s-icons">Иконки</h2>
          <ul class="ds-icons" data-ds-icons></ul>
        </section>

        <section class="ds-section" aria-labelledby="s-art">
          <h2 id="s-art">Иллюстрации</h2>
          <div class="ds-arts">
            <figure class="ds-art">
              <svg aria-hidden="true" data-ds-art="empty-fields"></svg>
              <figcaption class="ds-name">empty-fields</figcaption>
            </figure>
            <figure class="ds-art">
              <svg aria-hidden="true" data-ds-art="empty-batches"></svg>
              <figcaption class="ds-name">empty-batches</figcaption>
            </figure>
            <figure class="ds-art">
              <svg aria-hidden="true" data-ds-art="empty-waybills"></svg>
              <figcaption class="ds-name">empty-waybills</figcaption>
            </figure>
            <figure class="ds-art">
              <svg aria-hidden="true" data-ds-art="empty-lab"></svg>
              <figcaption class="ds-name">empty-lab</figcaption>
            </figure>
            <figure class="ds-art">
              <svg aria-hidden="true" data-ds-art="empty-recalls"></svg>
              <figcaption class="ds-name">empty-recalls</figcaption>
            </figure>
            <figure class="ds-art">
              <svg aria-hidden="true" data-ds-art="empty-complaints"></svg>
              <figcaption class="ds-name">empty-complaints</figcaption>
            </figure>
            <figure class="ds-art">
              <svg aria-hidden="true" data-ds-art="empty-notifications"></svg>
              <figcaption class="ds-name">empty-notifications</figcaption>
            </figure>
            <figure class="ds-art">
              <svg aria-hidden="true" data-ds-art="empty-search"></svg>
              <figcaption class="ds-name">empty-search</figcaption>
            </figure>
            <figure class="ds-art">
              <svg aria-hidden="true" data-ds-art="not-found"></svg>
              <figcaption class="ds-name">not-found</figcaption>
            </figure>
            <figure class="ds-art">
              <svg aria-hidden="true" data-ds-art="forbidden"></svg>
              <figcaption class="ds-name">forbidden</figcaption>
            </figure>
            <figure class="ds-art">
              <svg aria-hidden="true" data-ds-art="login"></svg>
              <figcaption class="ds-name">login</figcaption>
            </figure>
            <figure class="ds-art">
              <svg aria-hidden="true" data-ds-art="recall-warning"></svg>
              <figcaption class="ds-name">recall-warning</figcaption>
            </figure>
          </div>
        </section>
      </div>
    </main>

</html>
