    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access-токен JWT HS256 (15 минут) в заголовке `Authorization: Bearer <JWT>`.'
    accessTokenQuery:
      type: apiKey
      in: query
      name: access_token
      description: Access-токен в параметре запроса — только для `GET /events/stream` (EventSource не передаёт заголовки).
