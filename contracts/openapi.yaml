openapi: 3.1.0
info:
  title: AgroTrace API
  version: 1.0.0
  description: >-
    REST API системы прослеживаемости сельхозпродукции «от поля до прилавка». Контракт единый для трёх
    реализаций backend (Express, Django, Laravel): токен, файл или уведомление, созданные одной из них,
    принимаются любой другой. Расширения операций: `x-roles` — допустимые роли (`PUBLIC` — без авторизации,
    `ANY` — любой авторизованный), `x-org-admin` — для ролей кроме ADMIN требуется руководитель своей
    организации, `x-idempotent` — обязателен `Idempotency-Key`, `x-access: signed` — вместо Bearer допускается
    подписанный URL, `x-rate-limit` — скоупы лимитов из `contracts/rules/rate-limits.json` (скоуп `user`
    действует для всех запросов с Bearer). Строки: сервер никогда не обрезает пробелы и не превращает пустые
    строки в null; пароли сравниваются побайтно; поля имён и названий не могут состоять только из пробельных
    символов (`pattern: '\S'`); email приводится к нижнему регистру перед проверкой уникальности и поиском;
    длины строк (`minLength`/`maxLength`) считаются в кодовых точках Unicode.


    Доступ и видимость. Сущность вне области видимости пользователя (п. 4.2; правила — в описаниях тегов)
    неотличима от несуществующей: 404 NOT_FOUND, никогда не 403. 403 FORBIDDEN — роль не входит в `x-roles`
    (без `params`) либо сущность видна, но операцию выполняет другая сторона или она запрещена её состоянием
    (`params.reason`: NOT_HOLDER, NOT_SENDER, NOT_RECEIVER, EDIT_WINDOW_CLOSED, BATCH_STATUS; для входа —
    USER_BLOCKED, USER_INVITED, ORGANIZATION_NOT_ACTIVE). Ссылка в теле запроса на несуществующую или невидимую
    сущность — 400 VALIDATION `validation.notFound` (не 404). Пути полей в `errors` — через точку с индексами
    массивов: `items[0].batchId`.


    Порядок проверок, если операция не уточняет его: 401 → 403 по роли → `Idempotency-Key` → 400 по схеме
    параметров и тела → 404 → 403 по стороне операции → 409 VERSION_CONFLICT (`If-Match`) → 409 INVALID_TRANSITION
    (статус сущности из пути) → 400 по ссылкам тела → поэлементные проверки. Возвращается первая сработавшая ошибка.


    Списки: `sort` принимает только поля из `x-sort.fields` операции (иначе 400 `errors.sort: [validation.sort]`),
    по умолчанию — `x-sort.default`; сортировка выполняется в БД, при равенстве — по `id` по возрастанию, значения
    null всегда в конце. `q` — подстрока без учёта регистра, `%`, `_` и `\` в ней — обычные символы.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - bearer: []
tags:
  - name: Auth
    description: Вход, токены, TOTP, регистрация организации, сброс пароля, приглашения.
  - name: Profile
    description: Профиль текущего пользователя, аватарка, каналы уведомлений.
  - name: Users
    description: Сотрудники организации и их роли.
  - name: Organizations
    description: Карточка и логотип организации.
  - name: Fields
    description: >-
      Поля и обработки. Видимость: FARMER — неудалённые поля своего хозяйства (изменение — только их);
      INSPECTOR и ADMIN — все неудалённые поля, только чтение. Обработка видна вместе со своим полем.
  - name: Batches
    description: |
      Партии, граф, история, QR. Видимость (п. 4.2), удалённые партии не видны никому; при нескольких ролях —
      объединение:

      - INSPECTOR и ADMIN — все партии (только чтение);
      - LAB — партии, по которым есть неудалённый анализ (`lab_tests`) его лаборатории;
      - FARMER, PROCESSOR, RETAILER — множество S ∪ N, где S — партии, для которых организация пользователя —
        создатель (`origin`), текущий держатель (`holder`) либо отправитель или получатель накладной в статусе
        SENT, ACCEPTED или REJECTED, содержащей партию; N — непосредственные родители и дети партий из S
        в графе `batch_links` (глубина 1).

      Изменяющие операции проверяют сторону: действия держателя — организация пользователя = `holder`
      (иначе 403 NOT_HOLDER). Масса — строки `Mass` (три знака после точки).
  - name: Processing
    description: Переработка сырья в производные партии (только PROCESSOR, входные партии — у своей организации).
  - name: Waybills
    description: |
      Накладные и приёмка (R4: DRAFT → send → SENT → accept | reject; DRAFT можно удалить). Видимость
      (удалённые не видны):

      - FARMER, PROCESSOR, RETAILER — накладные, где организация пользователя отправитель (любой статус) или
        получатель (кроме DRAFT);
      - INSPECTOR и ADMIN — все накладные, кроме DRAFT (только чтение); LAB — нет доступа.
  - name: Lab
    description: Лабораторные анализы и протоколы.
  - name: Recalls
    description: Отзывы и задачи изъятия.
  - name: Complaints
    description: Рассмотрение жалоб покупателей.
  - name: Notifications
    description: Центр уведомлений.
  - name: Analytics
    description: Дашборды и отчёты.
  - name: Admin
    description: Заявки организаций и журнал аудита.
  - name: Dictionaries
    description: Справочники, импорт и фото продуктов.
  - name: Files
    description: Скачивание файлов с проверкой прав.
  - name: Public
    description: Публичная страница партии и жалобы без авторизации.
  - name: Health
    description: Проверки живости и готовности.
  - name: Events
    description: Доставка уведомлений через Server-Sent Events.
