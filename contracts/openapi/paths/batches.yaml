# Модуль Batches (FR-PROD-03, FR-PROD-07, FR-PROD-08). Видимость партий — в описании тега Batches (openapi.yaml).
/batches:
  get:
    operationId: listBatches
    summary: Список партий
    description: |
      Партии, видимые пользователю (п. 4.2, описание тега Batches). Фильтры (объединяются по И):

      - `status` — один или несколько статусов (`status=Approved&status=Accepted`), партия подходит при совпадении с любым;
      - `productId`; `kind`;
      - `holder` — `all` (по умолчанию): все видимые партии; `me`: только партии, текущий держатель которых —
        организация пользователя. Для INSPECTOR, ADMIN и LAB организация не держит партий, поэтому `holder=me`
        даёт пустую страницу;
      - `from`/`to` — по дате UTC производства: `harvestedAt` у RAW, `producedAt` у DERIVED;
      - `q` — подстрока `publicCode` без учёта регистра.

      Сортировка — `x-sort`.
    tags: [Batches]
    x-roles: [ANY]
    x-sort:
      fields: [publicCode, massKg, updatedAt, harvestedAt, producedAt]
      default: updatedAt,desc
    parameters:
      - $ref: '../components/parameters.yaml#/Page'
      - $ref: '../components/parameters.yaml#/Size'
      - $ref: '../components/parameters.yaml#/Sort'
      - $ref: '../components/parameters.yaml#/Q'
      - name: status
        in: query
        description: Фильтр по статусам (параметр повторяется).
        style: form
        explode: true
        schema:
          type: array
          uniqueItems: true
          items:
            $ref: '../schemas/common.yaml#/BatchStatus'
      - name: productId
        in: query
        description: Фильтр по продукту.
        schema:
          type: string
          format: uuid
      - name: holder
        in: query
        description: '`me` — только партии у организации пользователя; `all` — все видимые.'
        schema:
          type: string
          enum: [me, all]
          default: all
      - name: kind
        in: query
        description: Фильтр по виду партии.
        schema:
          $ref: '../schemas/batches.yaml#/BatchKind'
      - $ref: '../components/parameters.yaml#/DateFrom'
      - $ref: '../components/parameters.yaml#/DateTo'
    responses:
      '200':
        description: Страница партий.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/XRequestId'
          X-Backend:
            $ref: '../components/headers.yaml#/XBackend'
        content:
          application/json:
            schema:
              $ref: '../schemas/batches.yaml#/BatchPage'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
  post:
    operationId: createBatch
    summary: Регистрация сырьевой партии
    description: |
      Создаёт сырьевую партию (FR-PROD-03, БП-1) в одной транзакции:

      1. Проверки тела — 400 (см. `BatchCreate`).

      2. Вставка: `publicCode` = `next_batch_code()`, `kind` = RAW, `origin` = `holder` = организация пользователя,
      статус Created, `version` = 1; история: null → Created, `reason` CREATED, автор — пользователь.

      3. Риск-модель BR-03 (`requiresLabTest`): `farmBatchCount` — число неудалённых RAW-партий хозяйства,
      созданных до этой; `trustRating` — текущий рейтинг хозяйства; `pesticideTreatmentsLast30Days` — число
      неудалённых обработок поля препаратами типа PESTICIDE с `appliedAt` в интервале [сейчас − 30 суток, сейчас].
      Результат пишется в `testRequired`/`testReason`.

      4. Анализ не нужен — переход Created → Approved (`reason` TEST_NOT_REQUIRED, автор null).
      Нужен — назначается лаборатория: организация типа LAB в статусе ACTIVE с наименьшим числом неудалённых
      анализов в статусах QUEUED, SAMPLED, ESCALATED; сначала среди лабораторий региона поля, если их нет — среди
      всех; при равенстве — наименьший `id` (как текст). Создаётся анализ (`reason` = PLANNED для SAMPLED,
      иначе RISK; статус QUEUED; срок = 5 рабочих дней, `addWorkingDays`) и выполняется переход Created → OnTest
      (`reason` TEST_REQUIRED, автор null). Если активных лабораторий нет, партия остаётся в Created с
      `testRequired` = true.

      Каждый переход увеличивает `version` на 1. Ответ — карточка с итоговым статусом (OnTest, Approved или Created).
    tags: [Batches]
    x-roles: [FARMER]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/batches.yaml#/BatchCreate'
    responses:
      '201':
        description: Партия создана, решение риск-модели применено.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/XRequestId'
          X-Backend:
            $ref: '../components/headers.yaml#/XBackend'
        content:
          application/json:
            schema:
              $ref: '../schemas/batches.yaml#/Batch'
            example:
              id: 1c3e5a7c-9e1b-4d3f-8a5c-7e9b1d3f5a7c
              publicCode: AT-2026-000123
              product:
                id: 7a2b4c6d-8e0f-4a1b-9c3d-5e7f9a1b3c5d
                name: Пшеница озимая
                category: GRAIN
                imageUrl: /api/v1/public/files/2d4f6a8c-0e1a-4b3c-8d5e-7f9a1b3c5d7e
              massKg: '12480.000'
              status: OnTest
              kind: RAW
              holder:
                id: 0f8c2d7e-6a41-4b3e-9d25-7c1a9e4b2f10
                name: КФХ Петров
                type: FARM
                logoUrl: /api/v1/public/files/8e4a1c2b-7d3f-4a6e-b5c9-2f1e0d9c8b7a
              origin:
                id: 0f8c2d7e-6a41-4b3e-9d25-7c1a9e4b2f10
                name: КФХ Петров
                type: FARM
                logoUrl: /api/v1/public/files/8e4a1c2b-7d3f-4a6e-b5c9-2f1e0d9c8b7a
              harvestedAt: '2026-07-18T06:00:00Z'
              producedAt: null
              updatedAt: '2026-07-18T16:40:00Z'
              field:
                id: 2e4a6c8e-0b2d-4f6a-8c0e-2b4d6f8a0c2e
                name: Участок «Восточный-3»
              testRequired: true
              testReason: RECENT_PESTICIDE
              version: 2
              actions: []
              qrGeneratedAt: null
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
