/batches/{id}/documents/vsd/retry:
  post:
    operationId: retryBatchVsdImport
    summary: Повторный импорт ВСД
    description: |
      Запускает импорт ВСД из ФГИС «Меркурий» заново (R81), если прошлый завершился NOT_FOUND или FAILED. Первая
      сработавшая проверка возвращается:

      1. Формат `Idempotency-Key` и повтор по нему (описание параметра).

      Блокировки (R47, R52): партия `FOR UPDATE`, затем строка `batch_documents` (VSD) `FOR UPDATE`; шаги 2–5 — над
      заблокированными строками.

      2. Партия не видна — 404.

      3. Организация пользователя не держатель — 403 `{reason: NOT_HOLDER}`.

      4. У партии нет ВСД (продукт не DAIRY/MEAT или партия производная) — 404 NOT_FOUND.

      5. Импорт не в NOT_FOUND и не в FAILED — 409 INVALID_TRANSITION `{from: <importStatus>, to: PENDING}`.

      Результат (одна транзакция): `import_status` = PENDING, `attempts` = 0, `last_error` = null, найденные ранее поля
      документа не меняются (у NOT_FOUND/FAILED их нет); аудит `retryBatchVsdImport` (entityType batchDocument); в
      outbox — событие `vsd.import` (`contracts/events/vsd.import.schema.json`). Ответ 202 — ВСД в состоянии PENDING;
      результат импорта приходит асинхронно (`getBatchDocuments`). Статус и версия партии не меняются.
    tags: [Batches]
    x-roles: [FARMER, PROCESSOR]
    x-idempotent: true
    x-locks: [batches, batchDocument]
    x-transition: { entity: vsdImport, action: retry, to: PENDING }
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '202':
        description: Импорт поставлен в очередь.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/XRequestId'
          X-Backend:
            $ref: '../components/headers.yaml#/XBackend'
          Idempotent-Replayed:
            $ref: '../components/headers.yaml#/IdempotentReplayed'
        content:
          application/json:
            schema:
              $ref: '../schemas/batches.yaml#/BatchVsd'
            example:
              id: 4e6a8c0e-2a4c-4e6a-8c0e-2a4c6e8a0c2e
              importStatus: PENDING
              document: null
              attempts: 0
              requestedAt: '2026-07-19T07:30:00Z'
              updatedAt: '2026-07-21T10:15:00Z'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        description: Роль не FARMER/PROCESSOR (FORBIDDEN без `params`) или организация не держатель партии (NOT_HOLDER).
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/XRequestId'
          X-Backend:
            $ref: '../components/headers.yaml#/XBackend'
        content:
          application/problem+json:
            schema:
              $ref: '../schemas/common.yaml#/Problem'
            example:
              type: /problems/forbidden
              title: Not the batch holder
              status: 403
              code: FORBIDDEN
              params:
                reason: NOT_HOLDER
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: >-
          INVALID_TRANSITION (импорт не в NOT_FOUND/FAILED), VERSION_CONFLICT без `params` (повторная взаимоблокировка,
          R47), IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_KEY_IN_PROGRESS (`Retry-After: 1`).
        headers:
          Retry-After:
            $ref: '../components/headers.yaml#/RetryAfterInProgress'
          X-Request-Id:
            $ref: '../components/headers.yaml#/XRequestId'
          X-Backend:
            $ref: '../components/headers.yaml#/XBackend'
        content:
          application/problem+json:
            schema:
              $ref: '../schemas/common.yaml#/Problem'
            examples:
              importInProgress:
                summary: Импорт ещё выполняется
                value:
                  type: /problems/invalid-transition
                  title: Invalid status transition
                  status: 409
                  code: INVALID_TRANSITION
                  params:
                    from: PENDING
                    to: PENDING
              versionConflict:
                summary: Повторная взаимоблокировка
                value:
                  type: /problems/version-conflict
                  title: Version conflict
                  status: 409
                  code: VERSION_CONFLICT
              idempotencyKeyReused:
                summary: Ключ уже использован для другого запроса
                value:
                  type: /problems/idempotency-key-reused
                  title: Idempotency key reused
                  status: 409
                  code: IDEMPOTENCY_KEY_REUSED
              idempotencyKeyInProgress:
                summary: Первый запрос с этим ключом ещё выполняется
                value:
                  type: /problems/idempotency-key-in-progress
                  title: Idempotency key in progress
                  status: 409
                  code: IDEMPOTENCY_KEY_IN_PROGRESS
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
/batches/{id}/on-sale:
  post:
    operationId: putBatchOnSale
    summary: Выставление партии в продажу
    description: |
      Переход Accepted → OnSale (действие `putOnSale`; R20 — только из Accepted). Блокировки (R47): партия
      `FOR UPDATE`; проверки — над заблокированной строкой, `If-Match` — compare-and-set. Порядок проверок:

      1. Партия не видна — 404.

      2. Организация пользователя не держатель — 403 `{reason: NOT_HOLDER}`.

      3. `If-Match` ≠ `version` — 409 VERSION_CONFLICT `{currentVersion}`.

      4. Статус не Accepted — 409 INVALID_TRANSITION `{from: <статус>, to: OnSale}`.

      Результат: история (`reason` ON_SALE, автор — пользователь), `version` + 1, сброс кэша публичной
      страницы `pub:batch:{publicCode}`.
    tags: [Batches]
    x-roles: [RETAILER]
    x-locks: [batches]
    x-transition: { entity: batch, action: putOnSale, to: OnSale }
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
      - $ref: '../components/parameters.yaml#/IfMatch'
    responses:
      '200':
        description: Партия в продаже.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/XRequestId'
          X-Backend:
            $ref: '../components/headers.yaml#/XBackend'
        content:
          application/json:
            schema:
              $ref: '../schemas/batches.yaml#/Batch'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/BatchForbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: Устаревшая версия (VERSION_CONFLICT) или статус не Accepted (INVALID_TRANSITION).
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/XRequestId'
          X-Backend:
            $ref: '../components/headers.yaml#/XBackend'
        content:
          application/problem+json:
            schema:
              $ref: '../schemas/common.yaml#/Problem'
            examples:
              versionConflict:
                summary: Устаревшая версия
                value:
                  type: /problems/version-conflict
                  title: Version conflict
                  status: 409
                  code: VERSION_CONFLICT
                  params:
                    currentVersion: 6
              invalidTransition:
                summary: Партия не в статусе Accepted
                value:
                  type: /problems/invalid-transition
                  title: Invalid status transition
                  status: 409
                  code: INVALID_TRANSITION
                  params:
                    from: OnSale
                    to: OnSale
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
