/batches/{id}/qr:
  post:
    operationId: createBatchQr
    summary: Генерация QR-кода партии
    description: |
      Генерирует и сохраняет QR для печати (FR-PROD-08, R43, R44). Блокировки (R47): партия `FOR UPDATE`;
      проверки — над заблокированной строкой. Порядок проверок:

      1. Партия не видна — 404.

      2. Организация пользователя не держатель — 403 `{reason: NOT_HOLDER}`.

      3. Статус не допускает QR — 403 `{reason: BATCH_STATUS, status}`. Допускается: Accepted или OnSale;
      Approved — только для производной (DERIVED) партии, у которой организация пользователя — и создатель
      (`origin`), и держатель, при роли PROCESSOR.

      Результат: PNG (QR с `publicUrl`, уровень коррекции M,
      1024 × 1024 px, чёрный на белом, поле 4 модуля) и PDF (этикетка A6: QR, `publicCode`, название продукта,
      организация-создатель) сохраняются как файлы вида QR (`originalName` = `{publicCode}.png` / `{publicCode}.pdf`);
      `batches.qr_png_file_id` / `qr_pdf_file_id` указывают на новые файлы, прежние файлы QR партии (если были)
      мягко удаляются — ранее выданные на них ссылки перестают работать (404). `qrGeneratedAt` = текущее время;
      `version` партии не меняется. Ссылки в ответе подписаны (R28), действуют 3600 с.
    tags: [Batches]
    x-roles: [PROCESSOR, RETAILER]
    x-locks: [batches]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../schemas/batches.yaml#/QrRequest'
    responses:
      '201':
        description: QR сгенерирован.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/XRequestId'
          X-Backend:
            $ref: '../components/headers.yaml#/XBackend'
        content:
          application/json:
            schema:
              $ref: '../schemas/batches.yaml#/QrLinks'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/QrForbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: Повторная взаимоблокировка после одного повтора транзакции (VERSION_CONFLICT без `params`, R47).
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/XRequestId'
          X-Backend:
            $ref: '../components/headers.yaml#/XBackend'
        content:
          application/problem+json:
            schema:
              $ref: '../schemas/common.yaml#/Problem'
            example:
              type: /problems/version-conflict
              title: Version conflict
              status: 409
              code: VERSION_CONFLICT
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
  get:
    operationId: downloadBatchQr
    summary: Скачивание QR-кода партии
    description: >-
      Отдаёт сохранённый при последней генерации (`POST`) файл QR в выбранном формате — те же байты, что по
      подписанным ссылкам, поэтому ответ и `ETag` одинаковы во всех реализациях (R43). Проверки 1–3 — как в
      `createBatchQr`; затем QR ещё не генерировался (`qr_png_file_id`/`qr_pdf_file_id` пусты) — 404 NOT_FOUND.
      `Content-Disposition: inline; filename="{publicCode}.png|pdf"`; `ETag` — sha256 файла, `If-None-Match` → 304;
      `Cache-Control: private, max-age=0, must-revalidate`.
    tags: [Batches]
    x-roles: [PROCESSOR, RETAILER]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
      - name: format
        in: query
        required: true
        description: Формат файла.
        schema:
          type: string
          enum: [png, pdf]
        example: png
      - $ref: '../components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: Файл QR (PNG 1024 × 1024 px или PDF-этикетка A6).
        headers:
          ETag:
            $ref: '../components/headers.yaml#/ETag'
          Cache-Control:
            $ref: '../components/headers.yaml#/CacheControlPrivate'
          Content-Length:
            $ref: '../components/headers.yaml#/ContentLength'
          Content-Disposition:
            description: '`inline; filename="{publicCode}.png"` или `inline; filename="{publicCode}.pdf"`.'
            schema:
              type: string
              pattern: '^inline; filename="AT-\d{4}-\d{6,}\.(png|pdf)"$'
            example: inline; filename="AT-2026-000123.png"
          X-Request-Id:
            $ref: '../components/headers.yaml#/XRequestId'
          X-Backend:
            $ref: '../components/headers.yaml#/XBackend'
        content:
          image/png:
            schema:
              $ref: '../schemas/files.yaml#/FileBinary'
          application/pdf:
            schema:
              $ref: '../schemas/files.yaml#/FileBinary'
      '304':
        $ref: '../components/responses.yaml#/NotModified'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/QrForbidden'
      '404':
        description: Партия не видна или QR для неё ещё не генерировался (NOT_FOUND).
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/XRequestId'
          X-Backend:
            $ref: '../components/headers.yaml#/XBackend'
        content:
          application/problem+json:
            schema:
              $ref: '../schemas/common.yaml#/Problem'
            example:
              type: /problems/not-found
              title: QR not generated
              status: 404
              code: NOT_FOUND
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
/batches/{id}/documents:
  get:
    operationId: getBatchDocuments
    summary: Документы партии
    description: >-
      Сопроводительные документы партии (R81): ВСД из ФГИС «Меркурий» (`vsd`, null — у партии нет ВСД: продукт не
