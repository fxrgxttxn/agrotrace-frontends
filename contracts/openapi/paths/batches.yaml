/batches/{id}/graph:
  get:
    operationId: getBatchGraph
    summary: Граф связанных партий
    description: >-
      Родители и потомки партии в графе переработки на `depth` уровней в обе стороны (FR-PROD-07); состав
      и порядок — в описании `BatchGraph`. Корень не виден пользователю — 404; `depth` вне 1..5 или не целое —
      400 `errors.depth: [validation.range]`.
    tags: [Batches]
    x-roles: [ANY]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
      - name: depth
        in: query
        description: Глубина обхода в каждую сторону.
        schema:
          type: integer
          minimum: 1
          maximum: 5
          default: 2
    responses:
      '200':
        description: Граф партии.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/XRequestId'
          X-Backend:
            $ref: '../components/headers.yaml#/XBackend'
        content:
          application/json:
            schema:
              $ref: '../schemas/batches.yaml#/BatchGraph'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
/batches/{id}/history:
  get:
    operationId: getBatchHistory
    summary: История статусов партии
    description: >-
      Все записи `batch_status_history` партии без пагинации (их число ограничено жизненным циклом), по
      `changedAt` по возрастанию, при равенстве — в порядке вставки. Невидимая партия — 404.
    tags: [Batches]
    x-roles: [ANY]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
    responses:
      '200':
        description: История статусов.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/XRequestId'
          X-Backend:
            $ref: '../components/headers.yaml#/XBackend'
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/batches.yaml#/StatusHistoryItem'
            example:
              - from: null
                to: Created
                changedAt: '2026-07-18T16:40:00Z'
                reason: CREATED
                changedBy:
                  fullName: Петров Иван Сергеевич
                  avatarUrl: /api/v1/files/3c9d7e1f-2a4b-4c6d-8e0f-1a2b3c4d5e6f?exp=1790247600&sig=9f2c4e6a8b0d1f3e5a7c9b1d3f5e7a9c1b3d5f7e9a1c3b5d7f9e1a3c5b7d9f1e
              - from: Created
                to: OnTest
                changedAt: '2026-07-18T16:40:00Z'
                reason: TEST_REQUIRED
                changedBy: null
              - from: OnTest
                to: Approved
                changedAt: '2026-07-25T14:10:00Z'
                reason: LAB_PASS
                changedBy: null
              - from: Approved
                to: InTransit
                changedAt: '2026-08-01T08:15:00Z'
                reason: WAYBILL_SENT
                changedBy:
                  fullName: Петров Иван Сергеевич
                  avatarUrl: null
      '400':
