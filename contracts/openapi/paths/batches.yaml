/batches/{id}/qr:
  post:
    operationId: createBatchQr
    summary: Генерация QR-кода партии
    description: |
      Генерирует QR для печати (FR-PROD-08). Порядок проверок:

      1. Партия не видна — 404.

      2. Организация пользователя не держатель — 403 `{reason: NOT_HOLDER}`.

      3. Статус не Accepted и не OnSale — 403 `{reason: BATCH_STATUS, status}`.

      Результат: PNG (QR с `publicUrl`, уровень коррекции M, 1024 × 1024 px, чёрный на белом, поле 4 модуля) и PDF
      (этикетка A6: QR, `publicCode`, название продукта, организация-создатель) сохраняются как файлы
      (`originalName` = `{publicCode}.png` / `{publicCode}.pdf`), `qrGeneratedAt` = текущее время. Каждый вызов
      создаёт новые файлы; `version` партии не меняется. Ссылки подписаны (R28), действуют 3600 с.
    tags: [Batches]
    x-roles: [PROCESSOR, RETAILER]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../schemas/batches.yaml#/QrRequest'
    responses:
      '201':
        description: QR сгенерирован.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/XRequestId'
          X-Backend:
            $ref: '../components/headers.yaml#/XBackend'
        content:
          application/json:
            schema:
              $ref: '../schemas/batches.yaml#/QrLinks'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/QrForbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
  get:
    operationId: downloadBatchQr
    summary: Скачивание QR-кода партии
    description: >-
      Отдаёт QR партии в выбранном формате, формируя его заново с тем же содержимым, что и `POST` (наличие
      предыдущей генерации не требуется). Проверки — как в `createBatchQr`. `Content-Disposition:
      inline; filename="{publicCode}.png|pdf"`; `ETag` — sha256 отдаваемых байтов, `If-None-Match` → 304;
      `Cache-Control: private, max-age=0, must-revalidate`.
    tags: [Batches]
    x-roles: [PROCESSOR, RETAILER]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
      - name: format
        in: query
        required: true
        description: Формат файла.
        schema:
          type: string
          enum: [png, pdf]
        example: png
      - $ref: '../components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: Файл QR (PNG 1024 × 1024 px или PDF-этикетка A6).
        headers:
          ETag:
            $ref: '../components/headers.yaml#/ETag'
          Cache-Control:
            $ref: '../components/headers.yaml#/CacheControlPrivate'
          Content-Length:
            $ref: '../components/headers.yaml#/ContentLength'
          Content-Disposition:
            description: '`inline; filename="{publicCode}.png"` или `inline; filename="{publicCode}.pdf"`.'
            schema:
              type: string
              pattern: '^inline; filename="AT-\d{4}-\d{6,}\.(png|pdf)"$'
            example: inline; filename="AT-2026-000123.png"
          X-Request-Id:
            $ref: '../components/headers.yaml#/XRequestId'
          X-Backend:
            $ref: '../components/headers.yaml#/XBackend'
        content:
          image/png:
            schema:
              $ref: '../schemas/files.yaml#/FileBinary'
          application/pdf:
            schema:
              $ref: '../schemas/files.yaml#/FileBinary'
      '304':
        $ref: '../components/responses.yaml#/NotModified'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/QrForbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
/batches/{id}/on-sale:
  post:
    operationId: putBatchOnSale
    summary: Выставление партии в продажу
    description: |
      Переход Accepted → OnSale (действие `putOnSale`; R20 — только из Accepted). Порядок проверок:

      1. Партия не видна — 404.

      2. Организация пользователя не держатель — 403 `{reason: NOT_HOLDER}`.

      3. `If-Match` ≠ `version` — 409 VERSION_CONFLICT `{currentVersion}`.

      4. Статус не Accepted — 409 INVALID_TRANSITION `{from: <статус>, to: OnSale}`.

      Результат: история (`reason` ON_SALE, автор — пользователь), `version` + 1, сброс кэша публичной
      страницы `pub:batch:{publicCode}`.
    tags: [Batches]
    x-roles: [RETAILER]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
      - $ref: '../components/parameters.yaml#/IfMatch'
    responses:
      '200':
        description: Партия в продаже.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/XRequestId'
          X-Backend:
            $ref: '../components/headers.yaml#/XBackend'
        content:
          application/json:
            schema:
              $ref: '../schemas/batches.yaml#/Batch'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/BatchForbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: Устаревшая версия (VERSION_CONFLICT) или статус не Accepted (INVALID_TRANSITION).
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/XRequestId'
          X-Backend:
            $ref: '../components/headers.yaml#/XBackend'
        content:
          application/problem+json:
            schema:
              $ref: '../schemas/common.yaml#/Problem'
            examples:
              versionConflict:
                summary: Устаревшая версия
                value:
                  type: /problems/version-conflict
                  title: Version conflict
                  status: 409
                  code: VERSION_CONFLICT
                  params:
                    currentVersion: 6
              invalidTransition:
                summary: Партия не в статусе Accepted
                value:
                  type: /problems/invalid-transition
                  title: Invalid status transition
                  status: 409
                  code: INVALID_TRANSITION
                  params:
                    from: OnSale
                    to: OnSale
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
/batches/{id}/sold:
  post:
    operationId: markBatchSold
    summary: Реализация партии
    description: |
      Переход OnSale → Sold (действие `sell`). Порядок проверок — как в `putBatchOnSale`; статус не OnSale —
      409 INVALID_TRANSITION `{from: <статус>, to: Sold}`. Результат: история (`reason` SOLD), `version` + 1,
      сброс кэша публичной страницы. Держатель не меняется.
    tags: [Batches]
    x-roles: [RETAILER]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
      - $ref: '../components/parameters.yaml#/IfMatch'
    responses:
      '200':
        description: Партия реализована.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/XRequestId'
          X-Backend:
            $ref: '../components/headers.yaml#/XBackend'
        content:
          application/json:
            schema:
              $ref: '../schemas/batches.yaml#/Batch'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/BatchForbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: Устаревшая версия (VERSION_CONFLICT) или статус не OnSale (INVALID_TRANSITION).
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/XRequestId'
          X-Backend:
            $ref: '../components/headers.yaml#/XBackend'
        content:
          application/problem+json:
            schema:
              $ref: '../schemas/common.yaml#/Problem'
            examples:
              versionConflict:
                summary: Устаревшая версия
                value:
                  type: /problems/version-conflict
                  title: Version conflict
                  status: 409
                  code: VERSION_CONFLICT
                  params:
                    currentVersion: 7
              invalidTransition:
