/waybills/{id}/reject:
  post:
    operationId: rejectWaybill
    summary: Отказ от накладной
    description: |
      Получатель отказывается от накладной; партии возвращаются отправителю (БП-3). Порядок проверок:

      1. Тело по схеме — 400.

      Блокировки (R47): накладная `FOR UPDATE`, затем партии её позиций `FOR UPDATE ORDER BY id`; шаги 2–5 —
      над заблокированными строками, `If-Match` — compare-and-set по заблокированной накладной.

      2. Накладная не видна — 404.

      3. Организация пользователя не получатель — 403 `{reason: NOT_RECEIVER}`.

      4. `If-Match` ≠ `version` — 409 VERSION_CONFLICT `{currentVersion}`.

      5. Статус не SENT — 409 INVALID_TRANSITION `{from: <статус>, to: REJECTED}`.

      Результат: накладная REJECTED, `rejectReason` = `reason`, `version` + 1; каждая партия в статусе InTransit →
      Approved (действие `reject`, `reason` WAYBILL_REJECTED, автор — пользователь, `version` + 1, сброс кэша);
      партии в других статусах (например, отозванные в пути) не меняются. Держатель остаётся прежним. Отказ
      возможен всегда, в том числе когда приёмку блокирует BR-06.

      Партия, отозванная в пути (Recalled): открытая задача отзыва по ней (статус OPEN или OVERDUE), назначенная
      получателю, переназначается отправителю — `recall_tasks.holder_org_id` = отправитель, срок `dueAt` не
      меняется, `version` задачи + 1; отправителю отправляется уведомление о задаче (R50).
      Такие задачи блокируются `FOR UPDATE ORDER BY id` после партий.
    tags: [Waybills]
    x-roles: [PROCESSOR, RETAILER]
    x-locks: [waybill, batches, recallTasks]
    x-transition: { entity: waybill, action: reject, to: REJECTED }
    parameters:
      - $ref: '../components/parameters.yaml#/IdPath'
      - $ref: '../components/parameters.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/waybills.yaml#/WaybillReject'
    responses:
      '200':
        description: Накладная отклонена.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/XRequestId'
          X-Backend:
            $ref: '../components/headers.yaml#/XBackend'
        content:
          application/json:
            schema:
              $ref: '../schemas/waybills.yaml#/Waybill'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/WaybillNotReceiver'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: Устаревшая версия (VERSION_CONFLICT) или накладная не в статусе SENT (INVALID_TRANSITION).
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/XRequestId'
          X-Backend:
            $ref: '../components/headers.yaml#/XBackend'
        content:
          application/problem+json:
            schema:
              $ref: '../schemas/common.yaml#/Problem'
            examples:
              versionConflict:
                summary: Устаревшая версия
                value:
                  type: /problems/version-conflict
                  title: Version conflict
                  status: 409
                  code: VERSION_CONFLICT
                  params:
                    currentVersion: 3
              invalidTransition:
                summary: Накладная уже принята
                value:
                  type: /problems/invalid-transition
                  title: Invalid status transition
                  status: 409
                  code: INVALID_TRANSITION
                  params:
                    from: ACCEPTED
                    to: REJECTED
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
