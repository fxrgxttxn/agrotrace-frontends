Recall:
  type: object
  description: >-
    Карточка отзыва: поля `RecallListItem` и дополнительные. `batches` — все строки `recall_batches` в порядке
    SOURCE, DOWN, UP, затем по `depth`, затем по `publicCode`; `tasks` — все задачи в порядке `dueAt`, затем по
    `publicCode` партии. Массивы без пагинации (ограничены графом). `openedBy` — пользователь, чей запрос открыл отзыв
    (для LAB — лаборант, внёсший результаты). `labTestId` — анализ с FAIL (trigger LAB), `complaintId` — жалоба
    (trigger COMPLAINT), иначе null.
  required:
    - id
    - sourceBatch
    - trigger
    - reason
    - status
    - blockUpstream
    - openedAt
    - closedAt
    - progress
    - batchesCount
    - openedBy
    - labTestId
    - complaintId
    - batches
    - tasks
    - version
  additionalProperties: false
  properties:
    id:
      $ref: './common.yaml#/Uuid'
    sourceBatch:
      $ref: './batches.yaml#/BatchListItem'
    trigger:
      $ref: '#/RecallTrigger'
    reason:
      type: string
    status:
      $ref: '#/RecallStatus'
    blockUpstream:
      type: boolean
    openedAt:
      $ref: './common.yaml#/DateTime'
    closedAt:
      $ref: './common.yaml#/NullableDateTime'
    progress:
      $ref: '#/RecallProgress'
    batchesCount:
      type: integer
      minimum: 1
    openedBy:
      oneOf:
        - $ref: '#/ActorRef'
        - type: 'null'
    labTestId:
      type: [string, 'null']
      format: uuid
    complaintId:
      type: [string, 'null']
      format: uuid
    batches:
      type: array
      minItems: 1
      items:
        $ref: '#/RecallBatch'
    tasks:
      type: array
      items:
        $ref: '#/RecallTask'
    version:
      type: integer
      minimum: 1
      description: Вставка — 1; +1 при закрытии (BR-10).
