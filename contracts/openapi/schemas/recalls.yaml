RecallCreate:
  type: object
  description: >-
    Ручной запуск отзыва инспектором (FR-QA-06). `sourceBatchId` — неудалённая партия в любом статусе (иначе 400
    `validation.notFound`); `blockUpstream` — отзывать также партии-источники (обход вверх, п. 5.6).
  required: [sourceBatchId, reason, blockUpstream]
  additionalProperties: false
  properties:
    sourceBatchId:
      $ref: './common.yaml#/Uuid'
    reason:
      type: string
      minLength: 1
      maxLength: 1000
      pattern: '\S'
    blockUpstream:
      type: boolean
  example:
    sourceBatchId: 1c3e5a7c-9e1b-4d3f-8a5c-7e9b1d3f5a7c
    reason: Жалобы покупателей на горечь муки, партия зерна связана с нарушением
    blockUpstream: false
RecallGraph:
  type: object
  description: >-
    Граф затронутых партий для карточки отзыва: `nodes` — все строки `recall_batches` (порядок как в `Recall.batches`),
    `edges` — все связи `batch_links`, у которых оба конца входят в `nodes` (порядок — по `publicCode` родителя, затем
    ребёнка). `taskStatus` — статус задачи изъятия по партии в этом отзыве, null — задачи нет.
  required: [recallId, nodes, edges]
  additionalProperties: false
  properties:
    recallId:
      $ref: './common.yaml#/Uuid'
    nodes:
      type: array
      minItems: 1
      items:
        type: object
        required: [id, publicCode, product, status, statusBefore, holder, direction, depth, taskStatus]
        additionalProperties: false
        properties:
          id:
            $ref: './common.yaml#/Uuid'
          publicCode:
            $ref: './batches.yaml#/PublicCode'
          product:
            $ref: './common.yaml#/ProductRef'
          status:
            $ref: './common.yaml#/BatchStatus'
          statusBefore:
            $ref: './common.yaml#/BatchStatus'
          holder:
            $ref: './common.yaml#/OrganizationRef'
          direction:
            $ref: '#/RecallDirection'
          depth:
            type: integer
            minimum: 0
            maximum: 20
          taskStatus:
            oneOf:
              - $ref: '#/RecallTaskStatus'
