# Отзывы и задачи изъятия (БП-5, FR-QA-05…07, BR-08, BR-10).
ActorRef:
  type: object
  description: Пользователь — автор действия (ФИО и аватарка; email и телефон не отдаются).
  required: [id, fullName, avatarUrl]
  additionalProperties: false
  properties:
    id:
      $ref: './common.yaml#/Uuid'
    fullName:
      type: string
    avatarUrl:
      $ref: './common.yaml#/NullableSignedFileUrl'
  example:
    id: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
    fullName: Соколова Анна Викторовна
    avatarUrl: null
RecallTrigger:
  type: string
  description: >-
    Источник отзыва: LAB — автоматически при заключении FAIL (`submitLabResults`); INSPECTOR — ручной запуск
    (`createRecall`); COMPLAINT — решение RECALL по жалобе (`decideComplaint`).
  enum: [LAB, INSPECTOR, COMPLAINT]
  example: LAB
RecallStatus:
  type: string
  description: OPEN — есть неподтверждённые задачи; CLOSED — все задачи подтверждены (BR-10) или задач нет.
  enum: [OPEN, CLOSED]
  example: OPEN
RecallDirection:
  type: string
  description: >-
    SOURCE — исходная партия (`depth` = 0); DOWN — производная (потомок по `batch_links`, `depth` ≥ 1);
    UP — источник (предок, `depth` ≥ 1), только при `blockUpstream` = true.
  enum: [SOURCE, DOWN, UP]
  example: DOWN
RecallTaskStatus:
  type: string
  description: >-
    OPEN — ждёт подтверждения; OVERDUE — срок истёк, эскалировано инспекторам (планировщик, BR-08); CONFIRMED —
    изъятие подтверждено держателем. Переходы — `contracts/rules/entity-state-machines.json` (`recallTask`).
  enum: [OPEN, CONFIRMED, OVERDUE]
  example: OPEN
RecallProgress:
  type: object
  description: >-
    Прогресс «подтверждено N из M»: `total` — число задач отзыва, `confirmed` — в статусе CONFIRMED, `overdue` —
    не подтверждённых, у которых now > `dueAt` (независимо от того, успел ли планировщик выставить OVERDUE).
  required: [confirmed, total, overdue]
  additionalProperties: false
  properties:
    confirmed:
      type: integer
      minimum: 0
    total:
      type: integer
      minimum: 0
    overdue:
      type: integer
      minimum: 0
  example:
    confirmed: 1
    total: 3
    overdue: 0
RecallTask:
  type: object
  description: >-
    Задача изъятия партии у держателя. `holder` — организация, которая должна подтвердить изъятие: текущий держатель
    партии, а для партии, отозванной в статусе InTransit, — получатель накладной SENT (при отказе от накладной задача
    переназначается отправителю, R50). `dueAt` = `recallTaskDueAt(openedAt)` = открытие отзыва + 24 ч (BR-08).
    `overdue` — вычисляется при чтении: статус не CONFIRMED и now > `dueAt`.
  required:
    - id
    - recallId
    - recallReason
    - batch
    - holder
    - dueAt
    - status
    - overdue
    - escalatedAt
    - confirmedAt
    - confirmedBy
    - createdAt
    - version
  additionalProperties: false
  properties:
    id:
      $ref: './common.yaml#/Uuid'
    recallId:
      $ref: './common.yaml#/Uuid'
    recallReason:
      type: string
      description: Причина отзыва (`Recall.reason`).
    batch:
      $ref: './batches.yaml#/BatchListItem'
    holder:
      $ref: './common.yaml#/OrganizationRef'
    dueAt:
      $ref: './common.yaml#/DateTime'
    status:
      $ref: '#/RecallTaskStatus'
    overdue:
      type: boolean
    escalatedAt:
      description: Момент эскалации планировщиком (перевод в OVERDUE); null — не эскалировалась.
      $ref: './common.yaml#/NullableDateTime'
    confirmedAt:
      $ref: './common.yaml#/NullableDateTime'
    confirmedBy:
      description: Кто подтвердил изъятие; null — не подтверждена.
      oneOf:
        - $ref: '#/ActorRef'
        - type: 'null'
    createdAt:
      $ref: './common.yaml#/DateTime'
    version:
      type: integer
      minimum: 1
      description: >-
        Версия для `If-Match` операции `confirmRecallTask`. Вставка — 1; +1 при эскалации, переназначении держателя
        (R50) и подтверждении.
  example:
    id: 5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e
    recallId: 4a5b6c7d-8e9f-4a0b-9c1d-2e3f4a5b6c7d
    recallReason: Жалобы покупателей на горечь муки, партия зерна связана с нарушением
    batch:
      id: 3d5f7b9d-1f3a-4c5e-9b7d-1f3a5c7e9b1d
      publicCode: AT-2026-000457
      product:
        id: a4c6e8f0-2b4d-4f6a-8c0e-4b6d8f0a2c4e
        name: Мука пшеничная высшего сорта
        category: PROCESSED
        imageUrl: null
      massKg: '9500.000'
      status: Recalled
      kind: DERIVED
      holder:
        id: 6c8e0a2b-4d6f-4b8d-9f1a-3c5e7a9b1d3f
        name: ООО «Кубань-Маркет»
        type: RETAILER
        logoUrl: null
      origin:
        id: 4b6d8f0a-2c4e-4a6b-8d0f-1a3c5e7a9b1d
        name: ООО «Кубанский мукомол»
