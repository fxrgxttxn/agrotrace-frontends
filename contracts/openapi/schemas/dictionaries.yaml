# Справочники (п. 7.2, FR-ADM-02): строки, входные данные, импорт.
DictionaryName:
  type: string
  description: >-
    products — продукты (категория, норма потерь, фото); substances — препараты со сроками ожидания; indicators —
    показатели; norms — нормативы (пара продукт + показатель уникальна); regions — регионы.
  enum: [products, substances, indicators, norms, regions]
  example: products
LossNormPercent:
  type: string
  pattern: '^(100\.00|\d{1,2}\.\d{2})$'
  description: Норма потерь продукта при переработке (BR-04), проценты от 0.00 до 100.00, ровно два знака после точки.
  example: '5.00'
NullableMercuryCode:
  type: [string, 'null']
  pattern: '^\d{2}(\.\d{1,3}){1,3}$'
  maxLength: 16
  description: >-
    Код продукта в ФГИС «Меркурий» (ОКПД2, например `10.51.11`) для импорта ВСД (R81, колонка
    `products.mercury_code`); null — кода нет, импорт ВСД для партий продукта завершается NOT_FOUND. В
    `ProductInput` необязателен (не передан — null: `PUT` заменяет запись целиком); импорт справочника его не затрагивает
    (новые продукты — null, у существующих код сохраняется).
  example: '10.51.11'
Product:
  type: object
  description: >-
    Продукт. Читают все авторизованные роли (в том числе `lossNormPercent` для мастера переработки, T9 note b).
    `deletedAt` не null только при `includeDeleted=true`.
  required: [id, name, category, lossNormPercent, mercuryCode, imageUrl, createdAt, updatedAt, deletedAt]
  additionalProperties: false
  properties:
    id:
      $ref: './common.yaml#/Uuid'
    name:
      type: string
    category:
      $ref: './common.yaml#/ProductCategory'
    lossNormPercent:
      $ref: '#/LossNormPercent'
    mercuryCode:
      $ref: '#/NullableMercuryCode'
    imageUrl:
      $ref: './common.yaml#/NullablePublicFileUrl'
    createdAt:
      $ref: './common.yaml#/DateTime'
    updatedAt:
      $ref: './common.yaml#/DateTime'
    deletedAt:
      $ref: './common.yaml#/NullableDateTime'
  example:
    id: 7a2b4c6d-8e0f-4a1b-9c3d-5e7f9a1b3c5d
    name: Пшеница озимая
    category: GRAIN
    lossNormPercent: '2.00'
    mercuryCode: null
    imageUrl: /api/v1/public/files/2d4f6a8c-0e1a-4b3c-8d5e-7f9a1b3c5d7e
    createdAt: '2026-06-01T00:00:00Z'
    updatedAt: '2026-06-01T00:00:00Z'
    deletedAt: null
ProductInput:
  type: object
  required: [name, category, lossNormPercent]
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 160
      pattern: '\S'
    category:
      $ref: './common.yaml#/ProductCategory'
    lossNormPercent:
      $ref: '#/LossNormPercent'
    mercuryCode:
      $ref: '#/NullableMercuryCode'
  example:
    name: Пшеница озимая
    category: GRAIN
    lossNormPercent: '2.00'
Substance:
  type: object
  required: [id, name, type, waitingPeriodDays, createdAt, updatedAt, deletedAt]
  additionalProperties: false
  properties:
    id:
      $ref: './common.yaml#/Uuid'
    name:
      type: string
    type:
      $ref: './common.yaml#/SubstanceType'
    waitingPeriodDays:
      type: integer
      minimum: 0
    createdAt:
      $ref: './common.yaml#/DateTime'
    updatedAt:
      $ref: './common.yaml#/DateTime'
    deletedAt:
      $ref: './common.yaml#/NullableDateTime'
  example:
    id: 9e1f3a5b-7c9d-4e0f-a2b4-c6d8e0f2a4b6
    name: Хлорпирифос
    type: PESTICIDE
    waitingPeriodDays: 30
    createdAt: '2026-06-01T00:00:00Z'
    updatedAt: '2026-06-01T00:00:00Z'
    deletedAt: null
SubstanceInput:
  type: object
  required: [name, type, waitingPeriodDays]
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 160
      pattern: '\S'
    type:
      $ref: './common.yaml#/SubstanceType'
    waitingPeriodDays:
      type: integer
      minimum: 0
      maximum: 3650
  example:
    name: Хлорпирифос
    type: PESTICIDE
    waitingPeriodDays: 30
Indicator:
  type: object
  required: [id, name, unit, createdAt, updatedAt, deletedAt]
  additionalProperties: false
  properties:
    id:
      $ref: './common.yaml#/Uuid'
    name:
      type: string
    unit:
      type: string
    createdAt:
      $ref: './common.yaml#/DateTime'
    updatedAt:
      $ref: './common.yaml#/DateTime'
    deletedAt:
      $ref: './common.yaml#/NullableDateTime'
  example:
    id: 2b4d6f8a-0c2e-4a4b-8d6f-8a0c2e4b6d8f
    name: Нитраты
    unit: мг/кг
    createdAt: '2026-06-01T00:00:00Z'
    updatedAt: '2026-06-01T00:00:00Z'
    deletedAt: null
IndicatorInput:
  type: object
  required: [name, unit]
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 160
      pattern: '\S'
    unit:
      type: string
      minLength: 1
      maxLength: 24
      pattern: '\S'
  example:
    name: Нитраты
    unit: мг/кг
Norm:
  type: object
  description: Норматив (жёсткое удаление, `deletedAt` нет). `product`/`indicator` могут быть мягко удалены.
  required: [id, product, indicator, maxValue, createdAt, updatedAt]
  additionalProperties: false
  properties:
    id:
      $ref: './common.yaml#/Uuid'
    product:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          $ref: './common.yaml#/Uuid'
        name:
          type: string
    indicator:
      type: object
      required: [id, name, unit]
      additionalProperties: false
      properties:
        id:
          $ref: './common.yaml#/Uuid'
        name:
          type: string
        unit:
          type: string
    maxValue:
      $ref: './lab.yaml#/IndicatorValue'
    createdAt:
      $ref: './common.yaml#/DateTime'
    updatedAt:
      $ref: './common.yaml#/DateTime'
  example:
    id: 6e8a0c2e-4a6c-4e8a-8c2e-4a6c8e0a2c4e
    product:
      id: 7a2b4c6d-8e0f-4a1b-9c3d-5e7f9a1b3c5d
      name: Пшеница озимая
    indicator:
      id: 2b4d6f8a-0c2e-4a4b-8d6f-8a0c2e4b6d8f
      name: Нитраты
      unit: мг/кг
    maxValue: '500.000000'
    createdAt: '2026-06-01T00:00:00Z'
    updatedAt: '2026-06-01T00:00:00Z'
NormInput:
  type: object
  description: >-
    `productId`/`indicatorId` — неудалённые продукт и показатель (иначе 400 `validation.notFound`); пара уже есть у другой
    строки — 400 `errors.indicatorId: [validation.duplicate]`.
  required: [productId, indicatorId, maxValue]
  additionalProperties: false
  properties:
    productId:
      $ref: './common.yaml#/Uuid'
    indicatorId:
      $ref: './common.yaml#/Uuid'
    maxValue:
      $ref: './common.yaml#/Decimal'
  example:
    productId: 7a2b4c6d-8e0f-4a1b-9c3d-5e7f9a1b3c5d
    indicatorId: 2b4d6f8a-0c2e-4a4b-8d6f-8a0c2e4b6d8f
    maxValue: '500'
RegionEntry:
  type: object
  description: Регион (жёсткое удаление, `deletedAt` нет).
  required: [id, code, name]
  additionalProperties: false
  properties:
    id:
      $ref: './common.yaml#/Uuid'
    code:
      $ref: './dictionaries-ref.yaml#/RegionCode'
    name:
      type: string
  example:
    id: 8c0e2a4c-6e8a-4c0e-9a4c-6e8a0c2e4a6c
    code: '23'
    name: Краснодарский край
RegionInput:
  type: object
  required: [code, name]
  additionalProperties: false
  properties:
    code:
      $ref: './dictionaries-ref.yaml#/RegionCode'
    name:
      type: string
      minLength: 1
      maxLength: 120
      pattern: '\S'
  example:
    code: '23'
    name: Краснодарский край
DictionaryEntry:
  description: Строка справочника `{name}` — схема по имени справочника (products → `Product` и т.д.).
  anyOf:
    - $ref: '#/Product'
    - $ref: '#/Substance'
    - $ref: '#/Indicator'
    - $ref: '#/Norm'
    - $ref: '#/RegionEntry'
DictionaryInput:
  description: >-
    Тело создания/изменения — схема по имени справочника (products → `ProductInput`, substances → `SubstanceInput`,
    indicators → `IndicatorInput`, norms → `NormInput`, regions → `RegionInput`); тело другой схемы — 400.
  anyOf:
    - $ref: '#/ProductInput'
    - $ref: '#/SubstanceInput'
    - $ref: '#/IndicatorInput'
    - $ref: '#/NormInput'
    - $ref: '#/RegionInput'
DictionaryPage:
  type: object
  description: Страница строк справочника `{name}`; все `items` — одной схемы (см. `DictionaryEntry`).
  required: [items, page, size, total]
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: '#/DictionaryEntry'
    page:
      $ref: './common.yaml#/PageNumber'
    size:
      $ref: './common.yaml#/PageSize'
    total:
      $ref: './common.yaml#/TotalCount'
  example:
    items:
      - id: 7a2b4c6d-8e0f-4a1b-9c3d-5e7f9a1b3c5d
        name: Пшеница озимая
        category: GRAIN
        lossNormPercent: '2.00'
        mercuryCode: null
        imageUrl: /api/v1/public/files/2d4f6a8c-0e1a-4b3c-8d5e-7f9a1b3c5d7e
        createdAt: '2026-06-01T00:00:00Z'
        updatedAt: '2026-06-01T00:00:00Z'
        deletedAt: null
    page: 1
    size: 20
    total: 1
ImportReport:
  type: object
  description: >-
    Итог импорта: `created` — новые строки, `updated` — изменённые (в том числе восстановленные мягко удалённые),
    `unchanged` — совпавшие со строкой справочника, `errors` — отклонённые строки файла (не применены), в порядке
    строк, затем колонок. `row` — номер строки файла с 1 (строка 1 — заголовок), `column` — имя колонки из заголовка
    или null (ошибка строки целиком), `message` — ключ i18n (`validation.required`, `validation.pattern`,
    `validation.notFound`, `validation.duplicate`, `validation.max`, `validation.maxLength`, `validation.enum`,
    `validation.import.columns`); ошибки одной строки — в порядке колонок заголовка (P23).
  required: [created, updated, unchanged, errors]
  additionalProperties: false
  properties:
    created:
      type: integer
      minimum: 0
    updated:
      type: integer
      minimum: 0
    unchanged:
      type: integer
      minimum: 0
    errors:
      type: array
      items:
        type: object
        required: [row, column, message]
        additionalProperties: false
        properties:
          row:
            type: integer
            minimum: 2
          column:
            type: [string, 'null']
          message:
            type: string
  example:
    created: 12
    updated: 3
    unchanged: 0
    errors:
      - row: 7
        column: lossNormPercent
        message: validation.pattern
      - row: 11
        column: name
        message: validation.duplicate
