LabTestPage:
  type: object
  required: [items, page, size, total]
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: '#/LabTestListItem'
    page:
      $ref: './common.yaml#/PageNumber'
    size:
      $ref: './common.yaml#/PageSize'
    total:
      $ref: './common.yaml#/TotalCount'
  example:
    items: []
    page: 1
    size: 20
    total: 0
LabTest:
  type: object
  description: >-
    Карточка анализа: поля `LabTestListItem` и дополнительные. `norms` — нормативы, по которым вносятся результаты:
    пока статус не DONE — текущие строки `norms` для продукта партии с неудалёнными показателями; для DONE — снимок из
    `results` (`maxValue` = `normValue`). Порядок `norms` и `results` — по названию показателя (кодовые точки Unicode),
    затем по `indicatorId`. `recallId` — отзыв, запущенный или найденный этим анализом при FAIL (иначе null).
  required:
    - id
    - batch
    - lab
    - reason
    - status
    - conclusion
    - dueAt
    - overdue
    - createdAt
    - sampledAt
    - completedAt
    - hasProtocol
    - escalatedAt
    - results
    - protocol
    - norms
    - recallId
    - version
    - actions
  additionalProperties: false
  properties:
    id:
      $ref: './common.yaml#/Uuid'
    batch:
      $ref: './batches.yaml#/BatchListItem'
    lab:
      $ref: './common.yaml#/OrganizationRef'
    reason:
      $ref: '#/LabTestReason'
    status:
      $ref: '#/LabTestStatus'
    conclusion:
      oneOf:
        - $ref: '#/LabConclusion'
        - type: 'null'
    dueAt:
      $ref: './common.yaml#/DateTime'
    overdue:
      type: boolean
    createdAt:
      $ref: './common.yaml#/DateTime'
    sampledAt:
      $ref: './common.yaml#/NullableDateTime'
    completedAt:
      $ref: './common.yaml#/NullableDateTime'
    hasProtocol:
      type: boolean
    escalatedAt:
      $ref: './common.yaml#/NullableDateTime'
    results:
      type: array
      description: Пусто, пока статус не DONE.
      items:
        $ref: '#/LabResult'
    protocol:
      description: PDF-протокол испытаний (`url` — подписанный, R28); null — не загружен.
      oneOf:
        - $ref: './common.yaml#/FileRef'
        - type: 'null'
    norms:
      type: array
      items:
        $ref: '#/LabNorm'
    recallId:
      type: [string, 'null']
      format: uuid
      description: >-
        Колонка `lab_tests.recall_id` (R57): отзыв, созданный этим анализом при FAIL, или уже открытый отзыв по партии,
        к которому он присоединился; не null только при `conclusion` = FAIL (CHECK в БД). Одинаков в ответе
        `submitLabResults` и при последующих чтениях.
    version:
      type: integer
      minimum: 1
      description: >-
        Версия для `If-Match` (`registerLabSample`, `submitLabResults`). Вставка — 1; +1 при каждом переходе статуса
        (в том числе эскалации планировщиком). Загрузка протокола версию не меняет.
    actions:
      type: array
      uniqueItems: true
      items:
        $ref: '#/LabTestActionName'
  example:
    id: 8f0a2c4e-6a8c-4e0a-9c2e-4a6c8e0a2c4e
    batch:
      id: 1c3e5a7c-9e1b-4d3f-8a5c-7e9b1d3f5a7c
      publicCode: AT-2026-000123
      product:
        id: 7a2b4c6d-8e0f-4a1b-9c3d-5e7f9a1b3c5d
        name: Пшеница озимая
        category: GRAIN
        imageUrl: /api/v1/public/files/2d4f6a8c-0e1a-4b3c-8d5e-7f9a1b3c5d7e
      massKg: '12480.000'
      status: Recalled
      kind: RAW
      holder:
        id: 0f8c2d7e-6a41-4b3e-9d25-7c1a9e4b2f10
        name: КФХ Петров
        type: FARM
        logoUrl: /api/v1/public/files/8e4a1c2b-7d3f-4a6e-b5c9-2f1e0d9c8b7a
      origin:
        id: 0f8c2d7e-6a41-4b3e-9d25-7c1a9e4b2f10
        name: КФХ Петров
        type: FARM
        logoUrl: /api/v1/public/files/8e4a1c2b-7d3f-4a6e-b5c9-2f1e0d9c8b7a
      harvestedAt: '2026-07-18T06:00:00Z'
      producedAt: null
      updatedAt: '2026-07-22T11:40:00Z'
      qrGeneratedAt: null
    lab:
      id: 5a7c9e1b-3d5f-4a7c-9e1b-3d5f7a9c1e3b
      name: ИЛ «Кубаньтест»
      type: LAB
      logoUrl: null
    reason: RISK
    status: DONE
    conclusion: FAIL
    dueAt: '2026-07-24T06:05:00Z'
    overdue: false
    createdAt: '2026-07-17T06:05:00Z'
    sampledAt: '2026-07-20T09:30:00Z'
    completedAt: '2026-07-22T11:40:00Z'
    hasProtocol: false
    escalatedAt: null
    results:
      - indicatorId: 2b4d6f8a-0c2e-4a4b-8d6f-8a0c2e4b6d8f
