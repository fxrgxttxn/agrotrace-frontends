LabTestCreate:
  type: object
  description: >-
    Внеплановый анализ (п. 4.3, назначает INSPECTOR). `batchId` — неудалённая партия, `labOrgId` — организация типа LAB
    в статусе ACTIVE (иначе 400 `validation.notFound` / `validation.labOrg.type`).
  required: [batchId, labOrgId]
  additionalProperties: false
  properties:
    batchId:
      $ref: './common.yaml#/Uuid'
    labOrgId:
      $ref: './common.yaml#/Uuid'
  example:
    batchId: 3d5f7b9d-1f3a-4c5e-9b7d-1f3a5c7e9b1d
    labOrgId: 5a7c9e1b-3d5f-4a7c-9e1b-3d5f7a9c1e3b
LabSampleRequest:
  type: object
  description: Тело не требуется; допускается пустой объект.
  additionalProperties: false
  properties: {}
  example: {}
LabResultsInput:
  type: object
  description: >-
    Все показатели продукта партии одним запросом: множество `indicatorId` должно в точности совпасть с `norms`
    анализа (нет лишних, нет пропущенных, без повторов). Значения — `Decimal` (до 8 цифр целой части и до 6 знаков
    дробной), сохраняются как `numeric(14,6)`.
  required: [results]
  additionalProperties: false
  properties:
    results:
      type: array
      minItems: 1
      maxItems: 200
      items:
        type: object
        required: [indicatorId, value]
        additionalProperties: false
        properties:
          indicatorId:
            $ref: './common.yaml#/Uuid'
          value:
            $ref: './common.yaml#/Decimal'
  example:
    results:
      - indicatorId: 2b4d6f8a-0c2e-4a4b-8d6f-8a0c2e4b6d8f
        value: '612'
      - indicatorId: 3c5e7a9b-1d3f-4b5c-9e7a-9b1d3f5c7e9a
        value: '0.15'
