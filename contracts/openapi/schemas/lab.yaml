# Лабораторный контроль (БП-2, FR-QA-02…05, BR-02).
LabTestStatus:
  type: string
  description: >-
    QUEUED — ожидает отбора пробы; SAMPLED — проба зарегистрирована; ESCALATED — срок (`dueAt`) истёк без результата,
    эскалировано руководителю лаборатории и инспекторам (планировщик); DONE — результаты внесены, заключение выставлено;
    CANCELLED — зарезервирован, операциями API v1 не устанавливается. Переходы — `contracts/rules/entity-state-machines.json`
    (`labTest`).
  enum: [QUEUED, SAMPLED, DONE, ESCALATED, CANCELLED]
  example: QUEUED
LabTestReason:
  type: string
  description: >-
    PLANNED — выборочная проверка риск-модели (BR-03, причина SAMPLED); RISK — обязательная по риск-модели (NEW_FARM,
    LOW_RATING, RECENT_PESTICIDE); INSPECTOR — внеплановый анализ, назначенный инспектором; COMPLAINT — внеплановый
    анализ по решению по жалобе.
  enum: [PLANNED, RISK, COMPLAINT, INSPECTOR]
  example: RISK
LabConclusion:
  type: string
  description: 'BR-02 (`concludeLabTest`): FAIL, если хотя бы одно значение строго больше норматива, иначе PASS.'
  enum: [PASS, FAIL]
  example: PASS
IndicatorValue:
  type: string
  pattern: '^\d{1,8}\.\d{6}$'
  description: >-
    Значение показателя или норматива в ответах: десятичная строка ровно с шестью знаками после точки (текстовое
    представление `numeric(14,6)` PostgreSQL), например `"0.015000"`.
  example: '0.015000'
LabNorm:
  type: object
  description: Норматив показателя для продукта партии (справочник `norms`).
  required: [indicatorId, name, unit, maxValue]
  additionalProperties: false
  properties:
    indicatorId:
      $ref: './common.yaml#/Uuid'
    name:
      type: string
    unit:
      type: string
    maxValue:
      $ref: '#/IndicatorValue'
  example:
    indicatorId: 2b4d6f8a-0c2e-4a4b-8d6f-8a0c2e4b6d8f
    name: Нитраты
    unit: мг/кг
    maxValue: '500.000000'
LabResult:
  type: object
  description: >-
    Результат по показателю. `normValue` — норматив на момент внесения (`lab_results.norm_value_snapshot`),
    `isExceeded` — `value` строго больше `normValue` (BR-02).
  required: [indicatorId, name, unit, value, normValue, isExceeded]
  additionalProperties: false
  properties:
    indicatorId:
      $ref: './common.yaml#/Uuid'
    name:
      type: string
    unit:
      type: string
    value:
      $ref: '#/IndicatorValue'
    normValue:
      $ref: '#/IndicatorValue'
    isExceeded:
      type: boolean
  example:
    indicatorId: 2b4d6f8a-0c2e-4a4b-8d6f-8a0c2e4b6d8f
    name: Нитраты
    unit: мг/кг
    value: '612.000000'
    normValue: '500.000000'
    isExceeded: true
LabTestActionName:
  type: string
  description: >-
    Действие над анализом, доступное текущему пользователю: `sample` — роль LAB, статус QUEUED; `submitResults` — роль
    LAB, статус QUEUED, SAMPLED или ESCALATED; `uploadProtocol` — роль LAB, статус не CANCELLED.
  enum: [sample, submitResults, uploadProtocol]
  example: submitResults
LabTestListItem:
  type: object
  description: Строка очереди проб.
  required:
    [
      id,
      batch,
      lab,
      reason,
      status,
      conclusion,
      dueAt,
      overdue,
      createdAt,
      sampledAt,
      completedAt,
      hasProtocol,
    ]
  additionalProperties: false
  properties:
    id:
      $ref: './common.yaml#/Uuid'
    batch:
      $ref: './batches.yaml#/BatchListItem'
    lab:
      $ref: './common.yaml#/OrganizationRef'
    reason:
      $ref: '#/LabTestReason'
    status:
      $ref: '#/LabTestStatus'
    conclusion:
      description: null, пока статус не DONE.
      oneOf:
        - $ref: '#/LabConclusion'
        - type: 'null'
    dueAt:
      description: Срок результата — `addWorkingDays(createdAt, 5)` (пять рабочих дней, только выходные, R24).
      $ref: './common.yaml#/DateTime'
    overdue:
      type: boolean
      description: >-
        Вычисляется при чтении: статус QUEUED, SAMPLED или ESCALATED и `isOverdue(dueAt, now)` (now > dueAt).
        Не зависит от того, успел ли планировщик выставить ESCALATED.
    createdAt:
      $ref: './common.yaml#/DateTime'
    sampledAt:
      $ref: './common.yaml#/NullableDateTime'
    completedAt:
      $ref: './common.yaml#/NullableDateTime'
    hasProtocol:
      type: boolean
  example:
    id: 8f0a2c4e-6a8c-4e0a-9c2e-4a6c8e0a2c4e
    batch:
      id: 1c3e5a7c-9e1b-4d3f-8a5c-7e9b1d3f5a7c
      publicCode: AT-2026-000123
      product:
        id: 7a2b4c6d-8e0f-4a1b-9c3d-5e7f9a1b3c5d
        name: Пшеница озимая
        category: GRAIN
        imageUrl: /api/v1/public/files/2d4f6a8c-0e1a-4b3c-8d5e-7f9a1b3c5d7e
      massKg: '12480.000'
      status: OnTest
      kind: RAW
      holder:
        id: 0f8c2d7e-6a41-4b3e-9d25-7c1a9e4b2f10
        name: КФХ Петров
        type: FARM
        logoUrl: /api/v1/public/files/8e4a1c2b-7d3f-4a6e-b5c9-2f1e0d9c8b7a
      origin:
        id: 0f8c2d7e-6a41-4b3e-9d25-7c1a9e4b2f10
        name: КФХ Петров
        type: FARM
        logoUrl: /api/v1/public/files/8e4a1c2b-7d3f-4a6e-b5c9-2f1e0d9c8b7a
      harvestedAt: '2026-07-18T06:00:00Z'
