# Организации.
OrganizationStatus:
  type: string
  description: >-
    PENDING — ожидает одобрения; MANUAL_CHECK — требует ручной проверки (DaData была недоступна);
    ACTIVE — активна; REJECTED — заявка отклонена; SUSPENDED — деятельность приостановлена.
  enum: [PENDING, MANUAL_CHECK, ACTIVE, REJECTED, SUSPENDED]
  example: ACTIVE
Organization:
  type: object
  required: [id, name, type, logoUrl, inn, address, region, trustRating, status]
  additionalProperties: false
  properties:
    id:
      $ref: './common.yaml#/Uuid'
    name:
      type: string
    type:
      $ref: './common.yaml#/OrganizationType'
    logoUrl:
      type: [string, 'null']
      description: Относительный URL логотипа `/api/v1/public/files/{fileId}`, null если логотипа нет.
    inn:
      type: string
      pattern: '^\d{10}(\d{2})?$'
    address:
      type: [string, 'null']
    region:
      $ref: './common.yaml#/Region'
    trustRating:
      type: integer
      minimum: 0
      maximum: 100
      description: Рейтинг доверия (BR-09).
    status:
      $ref: '#/OrganizationStatus'
  example:
    id: 0f8c2d7e-6a41-4b3e-9d25-7c1a9e4b2f10
    name: КФХ Петров
    type: FARM
    logoUrl: /api/v1/public/files/8e4a1c2b-7d3f-4a6e-b5c9-2f1e0d9c8b7a
    inn: '2311123456'
    address: 352380, Краснодарский край, г. Кропоткин, ул. Полевая, д. 12
    region:
      code: '23'
      name: Краснодарский край
    trustRating: 80
    status: ACTIVE
