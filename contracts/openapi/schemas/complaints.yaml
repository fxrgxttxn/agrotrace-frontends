# Жалобы покупателей (БП-6, FR-QA-08). Создание — `POST /public/batches/{publicCode}/complaints` (модуль Public).
ComplaintStatus:
  type: string
  description: >-
    NEW — поступила; IN_REVIEW — инспектор взял в работу (`startComplaintReview`); DECIDED — решение принято
    (`decideComplaint`). Переходы — `contracts/rules/entity-state-machines.json` (`complaint`).
  enum: [NEW, IN_REVIEW, DECIDED]
  example: NEW
ComplaintDecisionType:
  type: string
  description: >-
    REJECT — отклонить; LAB_TEST — назначить внеплановый анализ (обязателен `labOrgId`); RECALL — сразу запустить
    отзыв (исходная партия — партия жалобы).
  enum: [REJECT, LAB_TEST, RECALL]
  example: LAB_TEST
ComplaintListItem:
  type: object
  required: [id, batch, text, status, decision, createdAt, decidedAt]
  additionalProperties: false
  properties:
    id:
      $ref: './common.yaml#/Uuid'
    batch:
      $ref: './batches.yaml#/BatchListItem'
    text:
      type: string
    status:
      $ref: '#/ComplaintStatus'
    decision:
      oneOf:
        - $ref: '#/ComplaintDecisionType'
        - type: 'null'
    createdAt:
      $ref: './common.yaml#/DateTime'
    decidedAt:
      $ref: './common.yaml#/NullableDateTime'
  example:
    id: e1f2a3b4-c5d6-4e7f-8a9b-0c1d2e3f4a5b
    batch:
      id: 3d5f7b9d-1f3a-4c5e-9b7d-1f3a5c7e9b1d
