        name: ООО «Кубанский мукомол»
        type: PROCESSOR
        logoUrl: null
      harvestedAt: null
      producedAt: '2026-08-05T10:00:00Z'
      updatedAt: '2026-08-21T08:00:00Z'
      qrGeneratedAt: '2026-08-21T08:00:00Z'
    text: После употребления муки из этой партии у членов семьи появилась горечь во рту и тошнота.
