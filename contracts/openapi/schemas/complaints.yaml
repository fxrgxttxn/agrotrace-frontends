ComplaintPage:
  type: object
  required: [items, page, size, total]
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: '#/ComplaintListItem'
    page:
      $ref: './common.yaml#/PageNumber'
    size:
      $ref: './common.yaml#/PageSize'
    total:
      $ref: './common.yaml#/TotalCount'
  example:
    items: []
    page: 1
    size: 20
    total: 0
Complaint:
  type: object
  description: >-
    Карточка жалобы: поля `ComplaintListItem` и дополнительные. `contact` — контакт покупателя (виден только
    инспектору); `inspector` — инспектор, взявший жалобу в работу или принявший решение; `labTestId` — анализ,
    назначенный решением LAB_TEST; `recallId` — отзыв решения RECALL (новый или уже открытый по этой партии).
  required:
    - id
    - batch
    - text
    - status
    - decision
    - createdAt
    - decidedAt
    - contact
    - decisionComment
    - inspector
    - labTestId
    - recallId
  additionalProperties: false
  properties:
    id:
      $ref: './common.yaml#/Uuid'
    batch:
      $ref: './batches.yaml#/BatchListItem'
    text:
      type: string
    status:
      $ref: '#/ComplaintStatus'
    decision:
      oneOf:
        - $ref: '#/ComplaintDecisionType'
        - type: 'null'
    createdAt:
      $ref: './common.yaml#/DateTime'
    decidedAt:
      $ref: './common.yaml#/NullableDateTime'
    contact:
      type: [string, 'null']
    decisionComment:
      type: [string, 'null']
    inspector:
      oneOf:
        - $ref: './recalls.yaml#/ActorRef'
        - type: 'null'
    labTestId:
      type: [string, 'null']
      format: uuid
    recallId:
      type: [string, 'null']
      format: uuid
  example:
    id: e1f2a3b4-c5d6-4e7f-8a9b-0c1d2e3f4a5b
    batch:
      id: 3d5f7b9d-1f3a-4c5e-9b7d-1f3a5c7e9b1d
      publicCode: AT-2026-000457
      product:
        id: a4c6e8f0-2b4d-4f6a-8c0e-4b6d8f0a2c4e
        name: Мука пшеничная высшего сорта
        category: PROCESSED
        imageUrl: null
      massKg: '9500.000'
      status: OnSale
      kind: DERIVED
      holder:
        id: 6c8e0a2b-4d6f-4b8d-9f1a-3c5e7a9b1d3f
        name: ООО «Кубань-Маркет»
        type: RETAILER
        logoUrl: null
