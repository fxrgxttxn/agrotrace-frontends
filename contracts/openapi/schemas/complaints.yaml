ComplaintReviewRequest:
  type: object
  description: Тело не требуется; допускается пустой объект.
  additionalProperties: false
  properties: {}
  example: {}
ComplaintComment:
  type: string
  minLength: 1
  maxLength: 1000
  pattern: '\S'
  description: Комментарий инспектора к решению; при RECALL становится причиной отзыва (`Recall.reason`).
  example: Назначен внеплановый анализ на остаточные пестициды
ComplaintDecision:
  description: >-
    Решение по жалобе — один из трёх вариантов по `decision`: REJECT `{decision, comment}`; LAB_TEST
    `{decision, comment, labOrgId}` (`labOrgId` обязателен); RECALL `{decision, comment, blockUpstream?}`
    (`blockUpstream` по умолчанию false). `labOrgId` без LAB_TEST или `blockUpstream` без RECALL — 400
    `errors.labOrgId` / `errors.blockUpstream: [validation.notAllowed]`; LAB_TEST без `labOrgId` — 400
    `errors.labOrgId: [validation.required]`.
  oneOf:
    - type: object
      required: [decision, comment]
      additionalProperties: false
      properties:
        decision:
          type: string
          const: REJECT
        comment:
          $ref: '#/ComplaintComment'
    - type: object
      required: [decision, comment, labOrgId]
      additionalProperties: false
      properties:
        decision:
          type: string
          const: LAB_TEST
        comment:
          $ref: '#/ComplaintComment'
        labOrgId:
          $ref: './common.yaml#/Uuid'
    - type: object
      required: [decision, comment]
      additionalProperties: false
      properties:
        decision:
          type: string
          const: RECALL
        comment:
          $ref: '#/ComplaintComment'
        blockUpstream:
          type: boolean
          default: false
  example:
    decision: LAB_TEST
    comment: Назначен внеплановый анализ на остаточные пестициды
    labOrgId: 5a7c9e1b-3d5f-4a7c-9e1b-3d5f7a9c1e3b
