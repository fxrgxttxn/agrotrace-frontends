# Общие схемы, используемые всеми модулями контракта.
Uuid:
  type: string
  format: uuid
  example: 5b1e2a4c-3f6d-4e8a-9b7c-1d2e3f4a5b6c
DateTime:
  type: string
  format: date-time
  description: Момент времени ISO 8601 в UTC с суффиксом Z.
  example: '2026-09-24T08:30:00Z'
Date:
  type: string
  format: date
  example: '2026-09-24'
Mass:
  type: string
  pattern: '^\d{1,9}\.\d{3}$'
  description: Масса в килограммах, десятичная строка ровно с тремя знаками после точки.
  example: '12480.000'
Percent:
  type: string
  pattern: '^\d{1,3}\.\d{2}$'
  description: Процент, десятичная строка ровно с двумя знаками после точки.
  example: '2.50'
Decimal:
  type: string
  pattern: '^\d{1,8}(\.\d{1,6})?$'
  description: Неотрицательное десятичное число строкой (значения показателей, дозы, площадь).
  example: '0.015'
Email:
  type: string
  format: email
  maxLength: 254
  example: petrov@kfh-petrov.ru
Phone:
  type: string
  pattern: '^\+[1-9]\d{6,14}$'
  description: Телефон в формате E.164.
  example: '+79181234567'
Password:
  type: string
  minLength: 10
  maxLength: 128
  description: Пароль, не короче 10 символов (п. 8.8).
  example: Ozimaya-2026!
PageNumber:
  type: integer
  minimum: 1
  description: Номер страницы, начиная с 1.
  example: 1
PageSize:
  type: integer
  minimum: 1
  maximum: 100
  description: Размер страницы (не более 100).
  example: 20
TotalCount:
  type: integer
  minimum: 0
  description: Общее число элементов по фильтру.
  example: 42
ProblemCode:
  type: string
  description: >-
    Машиночитаемый код ошибки. Текст ошибки формирует frontend по `code`/`rule` и `params`
    из общего словаря i18n.
  enum:
    - VALIDATION
    - UNAUTHORIZED
    - FORBIDDEN
    - NOT_FOUND
    - INVALID_TRANSITION
    - VERSION_CONFLICT
    - BUSINESS_RULE
    - FILE_TOO_LARGE
    - UNSUPPORTED_MEDIA_TYPE
    - RATE_LIMITED
    - ACCOUNT_LOCKED
    - INVALID_CREDENTIALS
    - TWO_FACTOR_REQUIRED
    - INVALID_TWO_FACTOR_CODE
    - TOKEN_EXPIRED
    - IDEMPOTENCY_KEY_REUSED
    - INVALID_IDEMPOTENCY_KEY
    - CAPTCHA_FAILED
    - GRAPH_CYCLE
    - BACKEND_UNAVAILABLE
    - EXTERNAL_UNAVAILABLE
    - INTERNAL
  example: VALIDATION
Problem:
  type: object
  description: >-
    RFC 7807 Problem Details (`application/problem+json`). `type` детерминирован:
    `/problems/` + код в нижнем регистре через дефис (VERSION_CONFLICT → `/problems/version-conflict`).
    `title` — краткое описание для журналов, может различаться между реализациями; клиенты на него не опираются.
  required: [type, title, status, code]
  additionalProperties: false
  properties:
    type:
      type: string
      pattern: '^/problems/[a-z]+(-[a-z]+)*$'
    title:
      type: string
    status:
      type: integer
      minimum: 400
      maximum: 599
    detail:
      type: string
    code:
      $ref: '#/ProblemCode'
    rule:
      type: string
      pattern: '^BR-\d{2}$'
      description: Нарушенное бизнес-правило (только для 422 BUSINESS_RULE).
    params:
      type: object
      additionalProperties: true
      description: Данные для текста ошибки (например `until`, `substance`, `lockedUntil`, `from`, `to`, `currentVersion`).
    errors:
      type: object
      description: 'Для 400 VALIDATION: путь поля → список ключей i18n.'
      additionalProperties:
        type: array
        minItems: 1
        items:
          type: string
  example:
    type: /problems/validation
    title: Validation failed
    status: 400
    code: VALIDATION
    errors:
      email: [validation.email]
      password: [validation.minLength]
RoleCode:
  type: string
  enum: [FARMER, PROCESSOR, LAB, RETAILER, INSPECTOR, ADMIN]
  example: FARMER
BatchStatus:
  type: string
  enum:
    [Created, OnTest, Approved, InTransit, Accepted, Processed, OnSale, Sold, Blocked, Recalled, WrittenOff]
  example: Approved
OrganizationType:
  type: string
  enum: [FARM, PROCESSOR, LAB, RETAILER, AUTHORITY, PLATFORM]
  example: FARM
ProductCategory:
  type: string
  enum: [GRAIN, VEGETABLE, FRUIT, DAIRY, MEAT, OILSEED, PROCESSED]
  example: GRAIN
SubstanceType:
  type: string
  enum: [PESTICIDE, FERTILIZER]
  example: PESTICIDE
Region:
  type: object
  required: [code, name]
  additionalProperties: false
  properties:
    code:
      type: string
      maxLength: 8
    name:
      type: string
  example:
    code: '23'
    name: Краснодарский край
OrganizationRef:
  type: object
  required: [id, name, type, logoUrl]
  additionalProperties: false
  properties:
    id:
      $ref: '#/Uuid'
    name:
      type: string
    type:
      $ref: '#/OrganizationType'
    logoUrl:
      type: [string, 'null']
      description: Относительный URL логотипа `/api/v1/public/files/{fileId}` (логотип публичен), null если логотипа нет.
  example:
    id: 0f8c2d7e-6a41-4b3e-9d25-7c1a9e4b2f10
    name: КФХ Петров
    type: FARM
    logoUrl: /api/v1/public/files/8e4a1c2b-7d3f-4a6e-b5c9-2f1e0d9c8b7a
FileRef:
  type: object
  required: [id, url, mime, sizeBytes, originalName]
  additionalProperties: false
  properties:
    id:
      $ref: '#/Uuid'
    url:
      type: string
      pattern: '^/api/v1/(public/)?files/[0-9a-f-]{36}$'
      description: Относительный URL `/api/v1/files/{id}` или `/api/v1/public/files/{id}` (для публичных файлов).
    mime:
      type: string
      description: MIME-тип хранимого файла (для изображений после конвертации — `image/webp`).
    sizeBytes:
      type: integer
      minimum: 0
    originalName:
      type: string
  example:
    id: 3c9d7e1f-2a4b-4c6d-8e0f-1a2b3c4d5e6f
    url: /api/v1/files/3c9d7e1f-2a4b-4c6d-8e0f-1a2b3c4d5e6f
    mime: image/webp
    sizeBytes: 48213
    originalName: petrov.jpg
ProductRef:
  type: object
  required: [id, name, category, imageUrl]
  additionalProperties: false
  properties:
    id:
      $ref: '#/Uuid'
    name:
      type: string
    category:
      $ref: '#/ProductCategory'
    imageUrl:
      type: [string, 'null']
      description: Относительный URL фото продукта `/api/v1/public/files/{fileId}`, null если фото нет.
  example:
    id: 7a2b4c6d-8e0f-4a1b-9c3d-5e7f9a1b3c5d
    name: Пшеница озимая
    category: GRAIN
    imageUrl: /api/v1/public/files/2d4f6a8c-0e1a-4b3c-8d5e-7f9a1b3c5d7e
SubstanceRef:
  type: object
  required: [id, name, type, waitingPeriodDays]
  additionalProperties: false
  properties:
    id:
      $ref: '#/Uuid'
    name:
      type: string
    type:
      $ref: '#/SubstanceType'
    waitingPeriodDays:
      type: integer
      minimum: 0
  example:
    id: 9e1f3a5b-7c9d-4e0f-a2b4-c6d8e0f2a4b6
    name: Хлорпирифос
    type: PESTICIDE
    waitingPeriodDays: 30
HealthCheckStatus:
  type: string
  enum: [ok, fail]
  example: ok
Health:
  type: object
  description: '`checks` присутствует только в `/health/ready`.'
  required: [status]
  additionalProperties: false
  properties:
    status:
      $ref: '#/HealthCheckStatus'
    checks:
      type: object
      required: [db, redis, rabbitmq, s3]
      additionalProperties: false
      properties:
        db:
          $ref: '#/HealthCheckStatus'
        redis:
          $ref: '#/HealthCheckStatus'
        rabbitmq:
          $ref: '#/HealthCheckStatus'
        s3:
          $ref: '#/HealthCheckStatus'
  example:
    status: ok
    checks:
      db: ok
      redis: ok
      rabbitmq: ok
      s3: ok
