WaybillCreate:
  type: object
  description: >-
    Создание черновика накладной (статус DRAFT). `receiverOrgId` — организация в статусе ACTIVE типа PROCESSOR
    или RETAILER, не своя. Позиции — партии, видимые пользователю и находящиеся у его организации, без повторов,
    с `massDeclaredKg` ≤ текущей массы партии. Статусы партий и BR-01/BR-06 при создании не проверяются —
    только при отправке.
  required: [receiverOrgId, items]
  additionalProperties: false
  properties:
    receiverOrgId:
      $ref: './common.yaml#/Uuid'
    items:
      type: array
      minItems: 1
      maxItems: 100
      items:
        type: object
        required: [batchId, massDeclaredKg]
        additionalProperties: false
        properties:
          batchId:
            $ref: './common.yaml#/Uuid'
          massDeclaredKg:
            $ref: './common.yaml#/PositiveMass'
  example:
    receiverOrgId: 4b6d8f0a-2c4e-4a6b-8d0f-1a3c5e7a9b1d
    items:
      - batchId: 1c3e5a7c-9e1b-4d3f-8a5c-7e9b1d3f5a7c
        massDeclaredKg: '12480.000'
WaybillAccept:
  type: object
  description: >-
    Приёмка: ровно по одной позиции на каждую партию накладной (иначе 400 `errors.items: [validation.items.mismatch]`).
    `discrepancyAct` обязателен, если расхождение больше 2% (BR-07, 422); при меньшем расхождении
    допускается и сохраняется.
  required: [items]
  additionalProperties: false
  properties:
    items:
      type: array
      minItems: 1
      maxItems: 100
      items:
        type: object
        required: [batchId, massActualKg]
        additionalProperties: false
        properties:
          batchId:
            $ref: './common.yaml#/Uuid'
          massActualKg:
            description: Фактическая масса; становится новой массой партии (`massKg`).
            $ref: './common.yaml#/PositiveMass'
          discrepancyAct:
            type: string
            minLength: 1
            maxLength: 2000
            pattern: '\S'
  example:
    items:
      - batchId: 1c3e5a7c-9e1b-4d3f-8a5c-7e9b1d3f5a7c
        massActualKg: '12080.000'
        discrepancyAct: Недостача 400 кг при контрольном взвешивании на элеваторе, акт № 17 от 02.08.2026.
WaybillReject:
  type: object
  required: [reason]
  additionalProperties: false
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 500
      pattern: '\S'
  example:
    reason: Влажность зерна 17% при допустимых 14%, партия не соответствует договору.
