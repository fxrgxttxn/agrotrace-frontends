# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
# Health checks (spec 8.9) are unauthenticated probes for Docker/gateway and have no 4xx outcome:
# /health/live answers 200 and /health/ready answers 200 or 503.
openapi/paths/health.yaml:
  operation-4xx-response:
    - '#/~1health~1live/get/responses'
    - '#/~1health~1ready/get/responses'
