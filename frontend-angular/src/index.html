<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>AgroTrace</title>
  </head>
  <body>
    <at-root></at-root>
    <!-- boot-fallback (generated by scripts/boot-fallback.mjs) -->
    <style>
      #boot-fallback { visibility: hidden; animation: boot-fallback 0s 10s forwards; }
      @keyframes boot-fallback { to { visibility: visible; } }
    </style>
    <main class="at-page" id="boot-fallback" style="max-width: 30rem">
      <article class="at-card">
        <div class="at-empty">
          <p class="at-empty__text">Не удалось загрузить страницу.</p>
          <a class="at-button" data-variant="primary" href="">Повторить</a>
        </div>
      </article>
    </main>
    <!-- /boot-fallback -->
  </body>
</html>
