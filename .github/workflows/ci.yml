name: ci

# Every job runs the SAME ./at.sh commands a developer runs locally (see README.md / docs/deploy.md)
# inside Docker Compose on the runner (Docker is preinstalled on ubuntu-latest) — one source of
# truth for "what does a passing build actually mean" instead of re-describing services here.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Port 80 is always free on the runner (unlike a developer machine, where it may already be
  # taken — see docs/deploy.md's troubleshooting section); also what tests/gateway's
  # X-Forwarded-Port assertion reads back (process.env.GATEWAY_PORT).
  GATEWAY_PORT: '80'

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-store-restore
      - run: ./at.sh install
      - run: ./at.sh lint
      - run: ./at.sh typecheck
      - uses: ./.github/actions/pnpm-store-save
        if: always()

  unit:
    name: unit (contracts, domain, api-client, validation, i18n, design-system, mercury-mock, seed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-store-restore
      - run: ./at.sh install
      - run: ./at.sh pnpm --filter @agrotrace/contracts run lint:openapi
      # Every workspace package outside tests/* (R83); tests/* run in the db, gateway and ds jobs.
      - run: ./at.sh test
      - run: ./at.sh at:test
      - uses: ./.github/actions/pnpm-store-save
        if: always()

  db:
    name: db (migrate, schema.sql freshness, tests/db)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-store-restore
      - run: ./at.sh install
      - run: ./at.sh up infra
      - run: ./at.sh db:migrate
      # db:migrate always regenerates db/schema.sql from a throwaway DB replaying every migration
      # on disk (see dump_schema() in at.sh) — never from the long-lived dev DB, which can drift.
      # A diff here means a migration changed the schema without the committed file being updated.
      - name: schema.sql is up to date with db/migrations
        run: git diff --exit-code -- db/schema.sql
      - run: ./at.sh db:test
      - uses: ./.github/actions/pnpm-store-save
        if: always()

  seed:
    name: seed (reset + seed:test)
    runs-on: ubuntu-latest
    # Pinned so `./at.sh reset` and `./at.sh seed:test` see the same SEED_NOW: seed:test reseeds
    # once more with it and compares against the first seed for byte-identical idempotency.
    env:
      SEED_NOW: '2026-09-24T12:00:00Z'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-store-restore
      - run: ./at.sh install
      - run: ./at.sh up infra
      - run: ./at.sh reset
      - run: ./at.sh seed:test
      - uses: ./.github/actions/pnpm-store-save
        if: always()

  api-express:
    name: api (tests/api against Express)
    runs-on: ubuntu-latest
    env:
      SEED_NOW: '2026-09-24T12:00:00Z'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-store-restore
      - run: ./at.sh install
      - run: ./at.sh api:test express --reset
      - run: ./at.sh docs:test express
      - uses: ./.github/actions/pnpm-store-save
        if: always()

  ds:
    name: ds (design-system showcase, Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-store-restore
      - run: ./at.sh install
      - run: ./at.sh ds:test
      - uses: ./.github/actions/pnpm-store-save
        if: always()

  gateway:
    name: gateway (nginx routing, gw:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-store-restore
      - run: ./at.sh install
      - run: ./at.sh up gateway
      - run: ./at.sh gw:test
      - uses: ./.github/actions/pnpm-store-save
        if: always()

  e2e:
    name: e2e (shared Playwright suite tests/e2e, ${{ matrix.front }} × mock)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        front: [react, svelte]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-store-restore
      - run: ./at.sh install
      # The mock build carries its backend (@agrotrace/mock-api in the browser): no API container is needed. The
      # React stand gateway joins the shared network (created by the compose runs above; created here if not).
      - if: matrix.front == 'react'
        run: |
          ./at.sh fe:build react --mock
          docker network inspect agrotrace_at >/dev/null 2>&1 || docker network create agrotrace_at
      # The Angular stand (compose project agrotrace-angular, its own network) serves both builds: dist-mock at
      # angular-mock.localhost and dist (the public budget is checked by this build) at the other angular-* hosts.
      - if: matrix.front == 'angular'
        run: |
          ./at.sh fe:build angular
          ./at.sh fe:build angular --mock
      # The Svelte stand (compose project agrotrace-svelte, network agrotrace_svelte) serves both builds: build-mock at
      # svelte-mock.localhost and build (the public budget is checked by its own e2e) at svelte-express.localhost; the
      # shared suite runs through playwright-svelte on that network (./at.sh e2e svelte).
      - if: matrix.front == 'svelte'
        run: |
          ./at.sh fe:build svelte
          ./at.sh fe:build svelte --mock
      - run: ./at.sh fe:gateway ${{ matrix.front }}
      - run: ./at.sh e2e ${{ matrix.front }} mock
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results-${{ matrix.front }}
          path: tests/e2e/test-results/run
      - uses: ./.github/actions/pnpm-store-save
        if: always()
