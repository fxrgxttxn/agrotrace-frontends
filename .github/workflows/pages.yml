name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build mock fronts
    runs-on: ubuntu-latest
    env:
      npm_config_store_dir: ${{ github.workspace }}/../pnpm-store
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
        run: |
          for front in react angular svelte; do
            AT_BASE_PATH="${SITE_BASE}${front}/" pnpm --filter "@agrotrace/frontend-$front" build:mock
          done
          site/assemble.sh _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
