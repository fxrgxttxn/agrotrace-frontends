; api-laravel: FrankenPHP with the Octane workers (127.0.0.1:8080 + :METRICS_PORT /metrics, docker/Caddyfile) behind the thin
; HAProxy front on :PORT (docker/haproxy-api.cfg), the outbox relay (agrotrace:relay) and the SSE hub (agrotrace:sse-hub, L3).
;
; Stop (final review M1): supervisord stops one program at a time, the highest priority first — haproxy (400) →
; frankenphp (300) → relay (200) → sse-hub (100); the start order is the reverse, the front last. So no request is
; accepted once the back end begins to stop, and the relay still publishes what the last requests committed.
; - haproxy: soft stop (USR1); the requests and streams in flight get SHUTDOWN_TIMEOUT_MS (hard-stop-after), then
;   their connections close; stopwaitsecs = that + 2 s (AGROTRACE_STOP_WAIT_SECS, the exit watchdog).
; - frankenphp: no client is left by then (every request came through haproxy); Caddy grace_period 1 s, then 2 s more.
; - relay: flushes what is pending within 2 s (RelayDaemon::FLUSH_SEC; the rest stays in the outbox for the sweeper and
;   the next relay); 2 s more.
; - sse-hub: ends within 1 s; 2 s more.
; Usual worst case (a stream open, the broker slow): SHUTDOWN_TIMEOUT_MS + 1 + 2 + 1 s = 14 s at the default, inside
; the compose stop_grace_period; every program at its SIGKILL bound: SHUTDOWN_TIMEOUT_MS + 12 s (docker-compose.yml).
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=warn

[program:frankenphp]
priority=300
command=frankenphp run --config /app/docker/Caddyfile --adapter caddyfile
directory=/app
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:haproxy]
priority=400
command=haproxy -W -db -f /app/docker/haproxy-api.cfg
autorestart=true
startsecs=1
stopsignal=USR1
; soft stop: the connections in flight get SHUTDOWN_TIMEOUT_MS (hard-stop-after, docker/haproxy-api.cfg).
stopwaitsecs=%(ENV_AGROTRACE_STOP_WAIT_SECS)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The relay (Task 6, L4): publishes the outbox events the Octane workers committed, handed over after each response on
; a Unix datagram socket — requests never wait on the broker. At most one PostgreSQL connection, from the container's
; DbSlots (the DB_SLOTS budget, P61), held while ids are pending (+1 s idle grace). Ids a sender could not hand over
; are caught up from the outbox (RelayLoop); SIGTERM flushes the pending ids within 2 s (RelayDaemon::FLUSH_SEC).
[program:relay]
priority=200
command=php /app/artisan agrotrace:relay
directory=/app
environment=AGROTRACE_PROCESS="relay",DB_SLOTS_ENABLED="true"
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=4
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The SSE hub (Task 12, L3): the container's ONE `LISTEN notifications` session (its own connection — «sse-hub 1» of the
; P61 budget), fanning the payloads out to the streams through Redis pub/sub (App\Sse\Hub). SIGTERM: ends within 1 s.
[program:sse-hub]
priority=100
command=php /app/artisan agrotrace:sse-hub
directory=/app
environment=AGROTRACE_PROCESS="api",DB_SLOTS_ENABLED="false"
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
