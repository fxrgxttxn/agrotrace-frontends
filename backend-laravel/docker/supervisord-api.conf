; api-laravel: FrankenPHP with the Octane workers (127.0.0.1:8080 + :9464 /metrics, docker/Caddyfile) behind the thin
; HAProxy front on :8000 (docker/haproxy-api.cfg), and the outbox relay (agrotrace:relay). The SSE hub `agrotrace:sse-hub` (L3) joins in Task 12.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=warn

[program:frankenphp]
command=frankenphp run --config /app/docker/Caddyfile --adapter caddyfile
directory=/app
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=12
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:haproxy]
command=haproxy -W -db -f /app/docker/haproxy-api.cfg
autorestart=true
startsecs=1
stopsignal=USR1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The relay (Task 6, L4): publishes the outbox events the Octane workers committed, handed over after each response on
; a Unix datagram socket — requests never wait on the broker. At most one PostgreSQL connection, from the container's
; DbSlots (the DB_SLOTS budget, P61), held while ids are pending (+1 s idle grace). Ids a sender could not hand over
; are caught up from the outbox (RelayLoop); SIGTERM flushes the pending ids within 8 s (< stopwaitsecs).
[program:relay]
command=php /app/artisan agrotrace:relay
directory=/app
environment=AGROTRACE_PROCESS="relay",DB_SLOTS_ENABLED="true"
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=12
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
