; worker-laravel (L1, L2): two `agrotrace:consume` processes — the worker's two channels of agrotrace.laravel.jobs, each
; with prefetch 1, sharing one vsd.import lane (/tmp/agrotrace-vsd.lock). One PostgreSQL connection each (P61). The
; Telegram poller `agrotrace:telegram-poll` joins in Task 12.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=warn

[program:consume]
command=php /app/artisan agrotrace:consume
process_name=%(program_name)s-%(process_num)d
numprocs=2
directory=/app
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=12
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
