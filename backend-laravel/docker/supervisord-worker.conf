; worker-laravel (L1, L2): two `agrotrace:consume` processes — the worker's two channels of agrotrace.laravel.jobs, each
; with prefetch 1, sharing one vsd.import lane (/tmp/agrotrace-vsd.lock). One PostgreSQL connection each (P61). The
; Telegram poller `agrotrace:telegram-poll` (below).
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=warn

[program:consume]
command=php /app/artisan agrotrace:consume
process_name=%(program_name)s-%(process_num)d
numprocs=2
directory=/app
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=12
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The Telegram poller (Task 12; App\Infrastructure\Telegram\Poller): polls only while it holds `tg:poller`, at most one
; PostgreSQL connection, only while linking (the worker's third in the P61 budget). Without TELEGRAM_BOT_TOKEN it
; exits 0 at once — an expected exit, not restarted.
[program:telegram-poll]
command=php /app/artisan agrotrace:telegram-poll
directory=/app
autorestart=unexpected
exitcodes=0
startsecs=0
stopsignal=TERM
stopwaitsecs=12
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
