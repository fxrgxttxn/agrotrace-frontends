# api-laravel :8000 — a thin front of FrankenPHP (127.0.0.1:8080, docker/Caddyfile). Everything is passed through
# unchanged (raw request line, streamed body, unbuffered response for SSE) except:
# - a PATH with a malformed %-escape (`/batches/%zz`): Go's HTTP server (FrankenPHP is Caddy) would refuse it with its
#   own `400 text/plain` before PHP runs (url.ParseRequestURI). The original path travels in X-Agrotrace-Raw-Path
#   (never taken from the client) and every `%` of the forwarded path becomes `%25`, so ContractGate answers as
#   Express does: 405 + Allow for an undeclared method, 404 otherwise (P3, P8, review I2). nginx is no option: it
#   refuses such a URI itself.
# - a JSON body declared larger than 12 582 912 bytes: answered here at once, before any byte of it is read, with the
#   contract 413 and the connection closed (review I4); FrankenPHP/Octane would read the whole body first (Laravel's
#   Request::createFromBase decodes JSON bodies). A 413 of the application (a chunked body) closes the connection too.
# - HAProxy's own errors (a request it cannot parse, FrankenPHP restarting) are problem+json with X-Backend (M1).
global
    maxconn 4096
    pidfile /tmp/haproxy.pid

defaults
    mode http
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h
    timeout http-request 60s
    timeout http-keep-alive 30s
    # HAProxy's own answers (unparsable request, FrankenPHP restarting) as contract problems (static files: no
    # X-Request-Id, which HAProxy cannot add to a response it builds before parsing the request).
    errorfile 400 /app/docker/haproxy-errors/400.http
    errorfile 408 /app/docker/haproxy-errors/408.http
    errorfile 500 /app/docker/haproxy-errors/500.http
    errorfile 502 /app/docker/haproxy-errors/502.http
    errorfile 503 /app/docker/haproxy-errors/503.http
    errorfile 504 /app/docker/haproxy-errors/504.http

frontend api
    bind :8000
    http-request del-header x-agrotrace-raw-path
    # R79: the client's X-Request-Id when it matches the pattern, else a generated one (UUID v4).
    acl request_id_ok req.hdr(x-request-id) -m reg ^[A-Za-z0-9._-]{1,64}$
    http-request set-var(txn.request_id) req.hdr(x-request-id) if request_id_ok
    http-request set-var(txn.request_id) uuid unless request_id_ok

    acl json_body req.hdr(content-type) -m reg -i ^[[:space:]]*application/([^;]+\+)?json[[:space:]]*(;|$)
    acl too_large req.hdr_val(content-length) gt 12582912
    http-request return status 413 content-type "application/problem+json; charset=utf-8" string '{"type":"/problems/file-too-large","title":"File too large","status":413,"code":"FILE_TOO_LARGE","params":{"maxBytes":12582912}}' hdr X-Backend laravel hdr X-Request-Id "%[var(txn.request_id)]" hdr Connection close if json_body too_large

    acl bad_escape path_reg %([^0-9A-Fa-f]|[0-9A-Fa-f][^0-9A-Fa-f]|[0-9A-Fa-f]?$)
    http-request set-header X-Agrotrace-Raw-Path %[path] if bad_escape
    http-request set-path %[path,regsub(%,%25,g)] if bad_escape

    # P9: the client IP is the last X-Forwarded-For entry the gateway wrote, else the socket peer — this hop adds none.
    http-request set-header X-Forwarded-For %[src] unless { req.hdr(x-forwarded-for) -m found }
    # SSE (Task 12): once a response streams, HAProxy does not close its connection to FrankenPHP when the client
    # leaves (its client socket only sits in CLOSE_WAIT until the next write). The stream finds the client's socket by
    # this address (app/Sse/ClientSocketIo.php: /proc/net/tcp of this container) — never a value the client sent.
    http-request set-header X-Agrotrace-Client-Peer %[src]:%[src_port]
    # Express sends no Server header. Caddy's `header -Server` (docker/Caddyfile) is a deferred deletion that a streamed
    # response bypasses (FrankenPHP flushes through the unwrapped writer: SSE came out with `server: Caddy`), so it is
    # dropped here for every response.
    http-response del-header server
    # The application's 413 (a body over its limit) ends the connection at the client hop as well.
    http-response set-header Connection close if { status 413 }
    default_backend frankenphp

backend frankenphp
    # P18 (fix round 1, I2): when the client closes its connection, close the one to FrankenPHP at once — PHP sees no
    # disconnect before it writes (app/Http/ClientConnection.php reads this connection's state instead), so an aborted
    # upload's waiting SVG job can leave the lane. Side effect: a client that half-closes after its request is aborted.
    option abortonclose
    server app 127.0.0.1:8080
