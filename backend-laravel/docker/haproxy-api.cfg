# api-laravel :8000 — a thin front of FrankenPHP (127.0.0.1:8080, docker/Caddyfile). Why: Go's HTTP server (FrankenPHP
# is Caddy) refuses a request whose PATH has a malformed %-escape (`/batches/%zz`) with its own `400 text/plain` before
# any handler runs (url.ParseRequestURI); the contract wants 404 NOT_FOUND problem+json (P8, fix round 1 I2). HAProxy
# neither decodes nor normalizes the path (nginx refuses such a URI itself), so it answers exactly those requests and
# passes everything else through unchanged — raw request line, streamed body, unbuffered response (SSE).
global
    maxconn 4096
    pidfile /tmp/haproxy.pid

defaults
    mode http
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h
    timeout http-request 60s
    timeout http-keep-alive 30s

frontend api
    bind :8000
    acl bad_escape path_reg %([^0-9A-Fa-f]|[0-9A-Fa-f][^0-9A-Fa-f]|[0-9A-Fa-f]?$)
    # R79: the client's X-Request-Id when it matches the pattern, else a generated one.
    acl request_id_ok req.hdr(x-request-id) -m reg ^[A-Za-z0-9._-]{1,64}$
    http-request return status 404 content-type "application/problem+json; charset=utf-8" string '{"type":"/problems/not-found","title":"Not found","status":404,"code":"NOT_FOUND"}' hdr X-Backend laravel hdr X-Request-Id "%[req.hdr(x-request-id)]" if bad_escape request_id_ok
    http-request return status 404 content-type "application/problem+json; charset=utf-8" string '{"type":"/problems/not-found","title":"Not found","status":404,"code":"NOT_FOUND"}' hdr X-Backend laravel hdr X-Request-Id "%[uuid]" if bad_escape !request_id_ok
    # P9: the client IP is the last X-Forwarded-For entry the gateway wrote, else the socket peer — this hop adds none.
    http-request set-header X-Forwarded-For %[src] unless { req.hdr(x-forwarded-for) -m found }
    default_backend frankenphp

backend frankenphp
    server app 127.0.0.1:8080
