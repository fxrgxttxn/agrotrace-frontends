; AgroTrace Laravel (Plan 5): PHP settings of every process.
; L8: bodies are read by the application itself (php://input, 12 MiB + 1 cap; multipart streamed) — PHP never parses
; them into $_POST/$_FILES (it would drop repeated keys, rename `.` to `_`, ignore broken multipart).
enable_post_data_reading = Off
date.timezone = UTC
memory_limit = 512M
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
zend.exception_ignore_args = On
opcache.enable_cli = 1
apc.enable_cli = 1
apc.shm_size = 64M
variables_order = EGPCS
