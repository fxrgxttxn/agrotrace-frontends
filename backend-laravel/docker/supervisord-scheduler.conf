; scheduler-laravel (L5): one long-lived `agrotrace:job <name>` process per entry of the registry (routes/console.php):
; each loads Laravel once, runs its job at once and then on its own timer under the job's session advisory lock, and
; holds ONE PostgreSQL connection (4 in the P61 budget). A slow job (notification-delivery) never delays
; another. SIGTERM: the running tick finishes, then the process exits.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=warn

[program:lab-escalation]
command=php /app/artisan agrotrace:job lab-escalation
directory=/app
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=12
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:recall-task-overdue]
command=php /app/artisan agrotrace:job recall-task-overdue
directory=/app
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=12
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:notification-delivery]
command=php /app/artisan agrotrace:job notification-delivery
directory=/app
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=12
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:outbox-sweep]
command=php /app/artisan agrotrace:job outbox-sweep
directory=/app
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=12
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
