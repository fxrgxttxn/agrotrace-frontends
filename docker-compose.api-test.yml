# The api-test profile (P10): `./at api:test <backend>` layers this file over docker-compose.yml for the run, so the
# shared HTTP suite does not trip over rate limits it does not test (the contract's RATE_LIMIT_OVERRIDES, deployment
# configuration), and registration always takes DaData's "unavailable" path (no key → MANUAL_CHECK) whatever the
# local .env holds — the suite never calls the real DaData. A Telegram bot token is set so createTelegramCode issues
# codes (the api process never calls Telegram; polling is the worker's). The rate-limit tests themselves run against
# the plain backend: `./at api:test <backend> --ratelimits` (they register nobody). Later plans add api-django /
# api-laravel.
services:
  api-express:
    environment:
      RATE_LIMIT_OVERRIDES: '{"user":100000,"login-ip":100000}'
      DADATA_API_KEY: ''
      TELEGRAM_BOT_TOKEN: 'api-test-token'
      TELEGRAM_BOT_USERNAME: 'agrotrace_test_bot'
  # The vsd.import worker (R81) for tests/api/documents.test.ts: Mercury calls for the test-only product code 99.99.99
  # carry `X-Mock-Fail: 500` (mercury-mock fails them on purpose) and the retry delays start at 50 ms instead of 2 s,
  # so a FAILED import (6 calls) takes about 2 s. No real product has this code.
  worker-express:
    environment:
      MERCURY_FAIL_PRODUCT_CODES: '99.99.99'
      MERCURY_FAIL_MODE: '500'
      MERCURY_RETRY_BASE_MS: '50'
