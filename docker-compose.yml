# Merge convention (SP3): per-backend services go only inside `# --- <backend> (plan N) ---` … `# --- end <backend> ---`.
name: agrotrace
services:
  tools:
    build: { context: ., dockerfile: tools/node.Dockerfile }
    profiles: [tools]
    working_dir: /repo
    volumes:
      - .:/repo
      - pnpm-store:/pnpm/store
    env_file: [.env]
    networks: [at]
  playwright:
    image: mcr.microsoft.com/playwright:v1.48.2-jammy
    profiles: [tools]
    working_dir: /repo/tests/ds
    volumes: [.:/repo]
    ipc: host
    environment: { CI: "1" }
    # In `at` so docs:test reaches the gateway (ds:test serves the showcase itself and needs no network).
    networks: [at]
  postgres:
    image: postgres:16-alpine
    # Connection budget (P61, contract «Бюджет соединений с PostgreSQL»): 3 backends × 20 (api, worker, scheduler) = 60,
    # plus up to 30 for tools (tests/api ≤ 5, tests/db pools ≤ 20, seed, dbmate, psql), plus 3 superuser slots — set
    # explicitly so it never depends on the image default.
    command: ["postgres", "-c", "max_connections=100", "-c", "superuser_reserved_connections=3"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data, ./infra/postgres/init:/docker-entrypoint-initdb.d:ro]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 3s, retries: 20 }
    networks: [at]
  dbmate:
    image: ghcr.io/amacneil/dbmate:2
    profiles: [tools]
    environment: { DATABASE_URL: "${DATABASE_URL}", DBMATE_MIGRATIONS_DIR: /db/migrations, DBMATE_SCHEMA_FILE: /db/schema.sql }
    volumes: [./db:/db]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [at]
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20 }
    networks: [at]
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports: ["5672:5672", "15672:15672"]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 5s, retries: 30 }
    networks: [at]
  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: "${S3_ACCESS_KEY}", MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY}" }
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 3s, retries: 20 }
    networks: [at]
  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-10-08T09-37-26Z
    entrypoint: ["/bin/sh", "/init.sh"]
    environment: { S3_ACCESS_KEY: "${S3_ACCESS_KEY}", S3_SECRET_KEY: "${S3_SECRET_KEY}", S3_BUCKET: "${S3_BUCKET}" }
    volumes: [./infra/minio/init.sh:/init.sh:ro]
    depends_on: { minio: { condition: service_healthy } }
    networks: [at]
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]
    networks: [at]
  mercury-mock:
    build: { context: ./mercury-mock }
    # Healthcheck is defined once, in mercury-mock/Dockerfile (HEALTHCHECK),
    # so it also applies when the image is run outside this compose file.
    networks: [at]
  gateway:
    build: { context: ./gateway }
    # No `depends_on`: the gateway must start with no backend containers running at all (nginx
    # resolves api-<back> at request time via the Docker resolver, not at startup). Frontend dist
    # bind mounts (./frontend-<front>/dist -> /srv/<front>, overriding the baked-in placeholder,
    # R6) are added by the plans that create those directories.
    volumes:
      - ./packages/design-system:/srv/ds:ro
    # GATEWAY_PORT (.env.example default: 80) is the host port; override it in a local,
    # uncommitted .env when 80 is already taken on the machine. Also passed into the container
    # itself (R80): nginx's own $server_port is always 80 (the port it listens on *inside* the
    # container), so X-Forwarded-Port is templated from this env var at container start instead —
    # see gateway/nginx.conf.template and gateway/Dockerfile.
    environment: { GATEWAY_PORT: "${GATEWAY_PORT:-80}" }
    ports: ["${GATEWAY_PORT:-80}:80"]
    networks: [at]
  # ── Express backend (Plan 1): one image, three processes (spec 8.1, 14.4) ──
  # `./at up express` (infra + these three) or `./at up <front> express` (+ gateway). The API listens on 8000 inside
  # the `at` network only; the gateway proxies http://<front>-express.localhost:<GATEWAY_PORT>/api/ to it.
  api-express:
    build: { context: ., dockerfile: backend-express/Dockerfile }
    image: agrotrace/backend-express:dev
    command: ["node", "--enable-source-maps", "dist/main-api.js"]
    env_file: [.env]
    environment: { PORT: "8000", NODE_ENV: production }
    # Prometheus /metrics (METRICS_PORT, spec 14.5): inside the `at` network only — never published, never behind the
    # gateway (which proxies /api/ of port 8000).
    expose: ["9464"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/v1/health/live"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    depends_on: &express-deps
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
    stop_grace_period: 15s
    networks: [at]
  worker-express:
    build: { context: ., dockerfile: backend-express/Dockerfile }
    image: agrotrace/backend-express:dev
    command: ["node", "--enable-source-maps", "dist/main-worker.js"]
    env_file: [.env]
    environment: { NODE_ENV: production }
    depends_on: *express-deps
    stop_grace_period: 15s
    networks: [at]
  scheduler-express:
    build: { context: ., dockerfile: backend-express/Dockerfile }
    image: agrotrace/backend-express:dev
    command: ["node", "--enable-source-maps", "dist/main-scheduler.js"]
    env_file: [.env]
    environment: { NODE_ENV: production }
    depends_on: *express-deps
    stop_grace_period: 15s
    networks: [at]
  # --- django (plan 3) ---
  # --- end django ---
  # --- laravel (plan 5) ---
  # ── Laravel backend (Plan 5): one image, three processes (spec 8.1, 14.4) ──
  # `./at up laravel` (infra + these three) or `./at up <front> laravel` (+ gateway). One build (api-laravel's), the
  # same image for all three. The API (Octane on FrankenPHP) listens on 8000 inside the `at` network only; the
  # gateway proxies http://<front>-laravel.localhost:<GATEWAY_PORT>/api/ to it; /metrics on 9464 (P54), never
  # published. Laravel's variables come as ${VAR:-default}, so an older .env still boots (SP6). REDIS_PREFIX is empty:
  # the Redis keys of the contract are shared byte for byte (SP7). Every process validates its environment first
  # (docker/entrypoint.sh, exit 78).
  api-laravel:
    build: { context: ., dockerfile: backend-laravel/Dockerfile, target: prod }
    image: agrotrace/backend-laravel:dev
    env_file: [.env]
    environment:
      AGROTRACE_PROCESS: api
      APP_KEY: ${LARAVEL_APP_KEY:-base64:254FIkwy02CvTimPdIThP60dSK3LJIYN/95NET9PL9A=}
      OCTANE_WORKERS: ${OCTANE_WORKERS:-32}
      DB_SLOTS: ${DB_SLOTS:-11}
      REDIS_PREFIX: ''
      # Pinned like api-express: the healthcheck, the gateway upstream and `expose` all say 8000 (METRICS_PORT: 9464).
      PORT: '8000'
    expose: ["8000", "9464"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/api/v1/health/live"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    depends_on: &laravel-deps
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
    # The Octane workers hand committed event ids to the relay process as Unix datagrams (Task 6). The kernel default
    # of 10 queued datagrams per socket fills during one slow confirm; 4096 rides out ~10 s of a 400 req/s burst. The
    # relay also catches dropped ids up from the outbox itself, so this sets latency, not correctness.
    sysctls: { net.unix.max_dgram_qlen: 4096 }
    # 15 s covers SHUTDOWN_TIMEOUT_MS (10 s) + the 2 s of supervisord's stopwaitsecs in all three services
    # (docker/entrypoint.sh); a SHUTDOWN_TIMEOUT_MS above 13000 (accepted up to 120000, as in Express) needs more here.
    stop_grace_period: 15s
    networks: [at]
  # supervisord: 2 × agrotrace:consume (the worker's two channels of agrotrace.laravel.jobs, L1, L2); the Telegram
  # poller joins in Task 12.
  worker-laravel:
    image: agrotrace/backend-laravel:dev
    pull_policy: never
    command: ["supervisord", "-c", "/app/docker/supervisord-worker.conf"]
    env_file: [.env]
    environment:
      AGROTRACE_PROCESS: worker
      APP_KEY: ${LARAVEL_APP_KEY:-base64:254FIkwy02CvTimPdIThP60dSK3LJIYN/95NET9PL9A=}
      OCTANE_WORKERS: ${OCTANE_WORKERS:-32}
      DB_SLOTS: ${DB_SLOTS:-11}
      REDIS_PREFIX: ''
    depends_on:
      <<: *laravel-deps
      api-laravel: { condition: service_started }
    stop_grace_period: 15s
    networks: [at]
  # supervisord: the four job processes `agrotrace:job <name>` (L5: lab-escalation, recall-task-overdue,
  # notification-delivery, outbox-sweep), one PostgreSQL connection each. The service name is fixed (SP1:
  # `api:test <other>` stops it by its compose label).
  scheduler-laravel:
    image: agrotrace/backend-laravel:dev
    pull_policy: never
    command: ["supervisord", "-c", "/app/docker/supervisord-scheduler.conf"]
    env_file: [.env]
    environment:
      AGROTRACE_PROCESS: scheduler
      APP_KEY: ${LARAVEL_APP_KEY:-base64:254FIkwy02CvTimPdIThP60dSK3LJIYN/95NET9PL9A=}
      OCTANE_WORKERS: ${OCTANE_WORKERS:-32}
      DB_SLOTS: ${DB_SLOTS:-11}
      REDIS_PREFIX: ''
    depends_on:
      <<: *laravel-deps
      api-laravel: { condition: service_started }
    stop_grace_period: 15s
    networks: [at]
  # composer, Pest (pcov), Pint, Larastan over the mounted repository (`./at laravel:test|laravel:lint|composer`);
  # vendor/ lives in the laravel-vendor volume, not in the working tree. No depends_on, like `tools`: a one-off run
  # from a worktree would otherwise recreate the shared infra containers (their bind-mount paths differ per worktree,
  # so does compose's config hash); the stand is up before (prepare_test_db, `./at up infra`).
  php-tools:
    build: { context: ., dockerfile: backend-laravel/Dockerfile, target: dev }
    image: agrotrace/backend-laravel-tools:dev
    profiles: [tools]
    working_dir: /repo/backend-laravel
    volumes:
      - .:/repo
      - laravel-vendor:/repo/backend-laravel/vendor
    env_file: [.env]
    environment:
      AGROTRACE_PROCESS: test
      REDIS_PREFIX: ''
    networks: [at]
  # --- end laravel ---
  # Test-only stub of a real backend (./at.sh gw:test): a tiny node:http server, network-aliased
  # as api-express so the gateway's variable proxy_pass resolves it exactly like a real api-express
  # container would. Behind the gwtest profile so it never starts with a normal `docker compose up`
  # and never collides with the real api-express service a later plan adds.
  gateway-test-upstream:
    image: node:22-alpine
    profiles: [gwtest]
    working_dir: /app
    volumes:
      - ./gateway/test/stub-upstream.mjs:/app/server.mjs:ro
    command: ["node", "/app/server.mjs"]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/"], interval: 1s, timeout: 2s, retries: 15 }
    networks:
      at:
        aliases: [api-express]
networks:
  at: {}
volumes:
  pnpm-store: {}
  pgdata: {}
  miniodata: {}
  # --- django (plan 3) ---
  # --- end django ---
  # --- laravel (plan 5) ---
  laravel-vendor: {}
  # --- end laravel ---
